      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="sciGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgGradSci)" />
  <circle cx="620" cy="120" r="260" fill="url(#sciGlow)" />

  <g transform="translate(620, 200)" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75">
