<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Guru — SMK NIBA Super Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Global CSRF Helper & Fetch Interceptor -->
    <script>
        (function () {
            window.getCsrfToken = function () {
                const prefix = 'csrf_token=';
                const cookies = document.cookie ? document.cookie.split(';') : [];
                for (let i = 0; i < cookies.length; i++) {
                    const c = cookies[i].trim();
                    if (c.startsWith(prefix)) {
                        return decodeURIComponent(c.substring(prefix.length));
                    }
                }
                return '';
            };

            const origFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    const csrfToken = window.getCsrfToken();
                    if (csrfToken) {
                        options.headers = options.headers || {};
                        if (options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRF-Token')) {
                                options.headers.set('X-CSRF-Token', csrfToken);
                            }
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRF-Token', csrfToken]);
                        } else {
                            options.headers['X-CSRF-Token'] = csrfToken;
                        }
                    }
                }
                return origFetch(url, options);
            };
        })();
    </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex items-center justify-center p-4 selection:bg-zinc-900 selection:text-white">
    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 mb-4 shadow-sm">
                <i data-lucide="graduation-cap" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Portal Guru & LMS</h1>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5">SMK NIBA Super Apps — Akses KBM, Materi & Penilaian</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white dark:bg-zinc-900/70 border border-zinc-200/80 dark:border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-xs">
            <form id="guruLoginForm" onsubmit="handleGuruLogin(event)" class="space-y-4">
                <div>
                    <label for="nip" class="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-1.5">
                        Nomor Induk Pegawai (NIP)
                    </label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="nip" name="nip" required autofocus placeholder="Masukkan NIP Anda"
                            class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950/20 focus:border-zinc-900 dark:focus:border-zinc-400 transition-all">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-1.5">
                        Password / PIN
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="password" id="password" name="password" required placeholder="Default: NIP atau guru123"
                            class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl pl-9 pr-10 py-2.5 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950/20 focus:border-zinc-900 dark:focus:border-zinc-400 transition-all">
                        <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">
                            <i data-lucide="eye" id="passIcon" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-[11px] text-zinc-500 dark:text-zinc-400 mt-1.5">
                        Jika belum mengubah password, gunakan NIP Anda atau default <code class="px-1 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 font-mono text-[10px]">guru123</code>.
                    </p>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full mt-2 bg-zinc-900 hover:bg-zinc-800 text-white dark:bg-zinc-50 dark:text-zinc-900 dark:hover:bg-zinc-200 font-semibold py-2.5 px-4 rounded-xl text-xs shadow-xs transition-all flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Masuk ke Portal Guru</span>
                </button>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/login" class="text-xs text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 transition-colors inline-flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Kembali ke Halaman Utama</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePassVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function handleGuruLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full mr-2"></span> Memverifikasi...`;

            const form = document.getElementById('guruLoginForm');
            const formData = new FormData(form);

            try {
                const csrfToken = window.getCsrfToken ? window.getCsrfToken() : '';
                const headers = {};
                if (csrfToken) headers['X-CSRF-Token'] = csrfToken;

                const res = await fetch('/api/guru/login', {
                    method: 'POST',
                    headers: headers,
                    body: formData
                });

                const data = await res.json();
                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil',
                        text: `Selamat datang, ${data.teacher?.name || 'Bapak/Ibu Guru'}!`,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/guru/dashboard';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Masuk',
                        text: data.message || 'NIP atau password salah.',
                        confirmButtonColor: '#18181b'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan Jaringan',
                    text: 'Tidak dapat menghubungi server sekolah.',
                    confirmButtonColor: '#18181b'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
