{{define "admin_topbar"}}
<!-- Topbar Header (shadcn Clean Minimalist) -->
<header class="h-14 flex items-center justify-between px-4 sm:px-6 lg:px-8 z-20 bg-white/80 dark:bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-200/80 dark:border-zinc-800 flex-shrink-0">
    <div class="flex items-center gap-3 md:gap-4">
        <!-- Mobile Sidebar Toggle -->
        <button onclick="toggleMobileSidebar()"
            class="p-1.5 -ml-1 text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-md transition-colors focus:outline-none md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Breadcrumb / Page Title Hint -->
        <div class="hidden sm:flex items-center gap-2 text-xs text-zinc-400 dark:text-zinc-500">
            <span class="font-medium text-zinc-500 dark:text-zinc-400">Admin</span>
            <span>/</span>
            <span class="text-zinc-900 dark:text-zinc-100 font-semibold">{{if .PageTitle}}{{.PageTitle}}{{else}}Console{{end}}</span>
        </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
        <!-- Global Search Bar with Ctrl+K -->
        <div class="relative hidden sm:block w-60 md:w-72">
            <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-zinc-400">
                <i data-lucide="search" class="w-3.5 h-3.5"></i>
            </div>
            <input type="text" id="global-search-input" placeholder="Cari siswa, menu, aksi... (Ctrl+K)"
                class="w-full pl-8 pr-12 py-1.5 bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 rounded-lg text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:bg-white dark:focus:bg-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-950/10 dark:focus:ring-zinc-300/10 focus:border-zinc-900 dark:focus:border-zinc-100 transition-all shadow-2xs">
            <kbd
                class="absolute right-2 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-[9.5px] font-mono font-medium text-zinc-500 dark:text-zinc-400 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded shadow-2xs">Ctrl+K</kbd>
        </div>

        <!-- Server Clock -->
        <div
            class="hidden sm:flex items-center gap-1.5 bg-zinc-100/70 dark:bg-zinc-900 px-2.5 py-1 rounded-md border border-zinc-200/60 dark:border-zinc-800 text-[11px] font-mono font-medium text-zinc-700 dark:text-zinc-300">
            <i data-lucide="clock" class="w-3 h-3 text-zinc-400"></i>
            <span id="server-clock">--:--:-- WIB</span>
        </div>

        <!-- Theme Switcher (Dark/Light) -->
        <button type="button" data-stisla-theme-toggle onclick="toggleStislaTheme()" title="Ubah Tema (Gelap / Terang)"
            class="p-1.5 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-md transition-colors focus:outline-none border border-transparent hover:border-zinc-200/60 dark:hover:border-zinc-700">
            <i data-lucide="sun" class="w-4 h-4 hidden [data-theme='dark']_&amp;:block text-amber-400"></i>
            <i data-lucide="moon" class="w-4 h-4 block [data-theme='dark']_&amp;:hidden text-zinc-700"></i>
        </button>

        <!-- System Online Badge -->
        <div
            class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-medium bg-zinc-50 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Online</span>
        </div>

        <!-- Quick Profile Link -->
        <a href="/admin/settings" title="Pengaturan Akun"
            class="flex items-center gap-2 pl-2 border-l border-zinc-200/80 dark:border-zinc-800 hover:opacity-80 transition-opacity">
            <div
                class="w-7 h-7 rounded-md bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-bold text-[11px] shadow-xs">
                {{if .Username}}{{slice .Username 0 1}}{{else}}A{{end}}
            </div>
            <span
                class="hidden md:inline text-xs font-semibold text-zinc-800 dark:text-zinc-200">{{if .Username}}{{.Username}}{{else}}Admin{{end}}</span>
        </a>
    </div>
</header>
{{end}}
