{{define "admin_head"}}
<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{if .PageTitle}}{{.PageTitle}} · {{end}}Admin Console · SMK NIBA Super Apps</title>

        <!-- Pre-paint Theme Handler & Hash Navigation Interceptor -->
        <script>
            (function () {
                var t = localStorage.getItem("app-theme") || localStorage.getItem("stisla-theme");
                if (t === "dark" || t === "light") {
                    document.documentElement.dataset.theme = t;
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.dataset.theme = "dark";
                }

                // Auto-redirect from legacy SPA hash (#schedules -> /admin/schedules)
                if (window.location.hash) {
                    var hash = window.location.hash.replace('#', '').toLowerCase();
                    var validRoutes = ['schedules', 'audio', 'attendance', 'academics', 'points', 'settings', 'reports'];
                    if (validRoutes.indexOf(hash) !== -1) {
                        window.location.replace('/admin/' + hash);
                    }
                }
            })();
        </script>

        <!-- External Assets & Libraries -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet">

                        }

        <!-- Global CSRF Helper & Fetch Interceptor -->
        <script>
            (function () {
                window.getCsrfToken = function () {
                    const prefix = 'csrf_token=';
                    const cookies = document.cookie ? document.cookie.split(';') : [];
                    for (let i = 0; i < cookies.length; i++) {
                        const c = cookies[i].trim();
                        if (c.startsWith(prefix)) {
                            return decodeURIComponent(c.substring(prefix.length));
                        }
                    }
                    return '';
                };

                const origFetch = window.fetch;
                window.fetch = function (url, options) {
                    options = options || {};
                    const method = (options.method || 'GET').toUpperCase();
                    if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                        const csrfToken = window.getCsrfToken();
                        if (csrfToken) {
                            options.headers = options.headers || {};
                            if (options.headers instanceof Headers) {
                                if (!options.headers.has('X-CSRF-Token')) {
                                    options.headers.set('X-CSRF-Token', csrfToken);
                                }
                            } else if (Array.isArray(options.headers)) {
                                options.headers.push(['X-CSRF-Token', csrfToken]);
                            } else {
                                options.headers['X-CSRF-Token'] = csrfToken;
                            }
                        }
                    }
                    return origFetch(url, options);
                };
            })();
        </script>

        <!-- shadcn CSS Tokens & Core Primitives -->
        <style>
            :root {
                color-scheme: light;
                --background: #fafafa;
                --foreground: #09090b;
                --card: #ffffff;
                --card-foreground: #09090b;
                --popover: #ffffff;
                --popover-foreground: #09090b;
                --primary: #18181b;
                --primary-foreground: #fafafa;
                --secondary: #f4f4f5;
                --secondary-foreground: #18181b;
                --muted: #f4f4f5;
                --muted-foreground: #71717a;
                --accent: #f4f4f5;
                --accent-foreground: #18181b;
                --destructive: #ef4444;
                --destructive-foreground: #fafafa;
                --border: #e4e4e7;
                --input: #e4e4e7;
                --ring: #18181b;
                --radius: 0.5rem;
            }

            [data-theme="dark"] {
                color-scheme: dark;
                --background: #09090b;
                --foreground: #fafafa;
                --card: #18181b;
                --card-foreground: #fafafa;
                --popover: #18181b;
                --popover-foreground: #fafafa;
                --primary: #fafafa;
                --primary-foreground: #18181b;
                --secondary: #27272a;
                --secondary-foreground: #fafafa;
                --muted: #27272a;
                --muted-foreground: #a1a1aa;
                --accent: #27272a;
                --accent-foreground: #fafafa;
                --destructive: #7f1d1d;
                --destructive-foreground: #fafafa;
                --border: #27272a;
                --input: #27272a;
                --ring: #d4d4d8;
            }

            body {
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                -webkit-font-smoothing: antialiased;
                background-color: var(--background);
                color: var(--foreground);
            }

            /* No purple navbar background */
            .navbar-bg {
                display: none !important;
            }

            /* Dark Mode Theme Tokens for existing HTML elements */
            [data-theme="dark"] body {
                background-color: #09090b !important;
                color: #fafafa !important;
            }

            [data-theme="dark"] .bg-white {
                background-color: #121215 !important;
                color: #fafafa !important;
            }

            [data-theme="dark"] .bg-slate-50,
            [data-theme="dark"] .bg-gray-50,
            [data-theme="dark"] .bg-zinc-50 {
                background-color: #18181b !important;
            }

            [data-theme="dark"] .bg-slate-100,
            [data-theme="dark"] .bg-gray-100,
            [data-theme="dark"] .bg-zinc-100 {
                background-color: #27272a !important;
            }

            [data-theme="dark"] .border-slate-100,
            [data-theme="dark"] .border-slate-200,
            [data-theme="dark"] .border-gray-100,
            [data-theme="dark"] .border-gray-200,
            [data-theme="dark"] .border-zinc-200 {
                border-color: #27272a !important;
            }

            [data-theme="dark"] .text-slate-800,
            [data-theme="dark"] .text-gray-800,
            [data-theme="dark"] .text-slate-900,
            [data-theme="dark"] .text-zinc-900 {
                color: #f4f4f5 !important;
            }

            [data-theme="dark"] .text-slate-600,
            [data-theme="dark"] .text-gray-600,
            [data-theme="dark"] .text-slate-700,
            [data-theme="dark"] .text-zinc-700 {
                color: #d4d4d8 !important;
            }

            [data-theme="dark"] .text-slate-500,
            [data-theme="dark"] .text-gray-500,
            [data-theme="dark"] .text-zinc-500 {
                color: #a1a1aa !important;
            }

            [data-theme="dark"] input,
            [data-theme="dark"] select,
            [data-theme="dark"] textarea {
                background-color: #18181b !important;
                color: #fafafa !important;
                border-color: #27272a !important;
            }

            [data-theme="dark"] .modal-content,
            [data-theme="dark"] .card {
                background-color: #121215 !important;
                border-color: #27272a !important;
            }

            /* --- shadcn Sidebar Navigation Classes --- */
            .sidebar-menu-header {
                padding: 10px 14px 4px 14px;
                font-size: 10px;
                font-weight: 600;
                color: #a1a1aa;
                letter-spacing: 0.8px;
                text-transform: uppercase;
            }

            .sidebar-menu-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 7px 12px;
                margin: 2px 8px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 500;
                color: #52525b;
                transition: all 0.15s ease;
            }

            .sidebar-menu-item:hover {
                background-color: #f4f4f5;
                color: #18181b;
            }

            .sidebar-menu-item.active {
                background-color: #18181b;
                color: #fafafa !important;
                font-weight: 600;
            }

            [data-theme="dark"] .sidebar-menu-header {
                color: #71717a;
            }

            [data-theme="dark"] .sidebar-menu-item {
                color: #a1a1aa;
            }

            [data-theme="dark"] .sidebar-menu-item:hover {
                background-color: #27272a;
                color: #fafafa;
            }

            .sidebar-submenu-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 500;
                color: #71717a;
                transition: all 0.15s ease;
            }

            .sidebar-submenu-item:hover {
                background-color: #f4f4f5;
                color: #18181b;
            }

            .sidebar-submenu-item.active {
                background-color: #18181b;
                color: #fafafa !important;
                font-weight: 600;
            }

            [data-theme="dark"] .sidebar-submenu-item {
                color: #a1a1aa;
            }

            [data-theme="dark"] .sidebar-submenu-item:hover {
                background-color: #27272a;
                color: #fafafa;
            }

            [data-theme="dark"] .sidebar-submenu-item.active {
                background-color: #27272a;
                color: #fafafa !important;
                font-weight: 600;
            }

            /* ==========================================================================
               shadcn UI Primitives (Component Tokens)
               ========================================================================== */

            /* --- Buttons --- */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
                white-space: nowrap;
                border-radius: var(--radius);
                font-size: 0.8125rem;
                font-weight: 500;
                transition: all 0.15s ease;
                cursor: pointer;
                border: 1px solid transparent;
                padding: 0.4rem 0.8rem;
                line-height: 1.25rem;
                text-decoration: none;
            }

            .btn:focus-visible {
                outline: none;
                box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
            }

            .btn:disabled {
                pointer-events: none;
                opacity: 0.5;
            }

            .btn-default,
            .btn[data-variant="default"] {
                background-color: var(--primary);
                color: var(--primary-foreground);
            }

            .btn-default:hover,
            .btn[data-variant="default"]:hover {
                opacity: 0.9;
            }

            .btn-secondary,
            .btn[data-variant="secondary"] {
                background-color: var(--secondary);
                color: var(--secondary-foreground);
                border-color: var(--border);
            }

            .btn-secondary:hover,
            .btn[data-variant="secondary"]:hover {
                background-color: #e4e4e7;
            }

            [data-theme="dark"] .btn-secondary:hover,
            [data-theme="dark"] .btn[data-variant="secondary"]:hover {
                background-color: #3f3f46;
            }

            .btn-outline,
            .btn[data-variant="outline"] {
                border-color: var(--border);
                background-color: transparent;
                color: var(--foreground);
            }

            .btn-outline:hover,
            .btn[data-variant="outline"]:hover {
                background-color: var(--secondary);
            }

            .btn-destructive,
            .btn[data-variant="destructive"] {
                background-color: var(--destructive);
                color: var(--destructive-foreground);
            }

            .btn-destructive:hover,
            .btn[data-variant="destructive"]:hover {
                opacity: 0.9;
            }

            .btn-ghost,
            .btn[data-variant="ghost"] {
                background-color: transparent;
                color: var(--foreground);
            }

            .btn-ghost:hover,
            .btn[data-variant="ghost"]:hover {
                background-color: var(--muted);
            }

            .btn-sm,
            .btn[data-size="sm"] {
                padding: 0.25rem 0.55rem;
                font-size: 0.75rem;
                border-radius: calc(var(--radius) - 2px);
            }

            .btn-icon,
            .btn[data-size="icon"] {
                padding: 0.35rem;
                width: 2rem;
                height: 2rem;
            }

            /* --- Cards --- */
            .card-shadcn {
                background-color: var(--card);
                color: var(--card-foreground);
                border: 1px solid var(--border);
                border-radius: calc(var(--radius) + 2px);
                box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
            }

            .card-header {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
                padding: 1.25rem 1.5rem;
                border-bottom: 1px solid var(--border);
            }

            .card-title {
                font-size: 1.05rem;
                font-weight: 600;
                line-height: 1.25;
                letter-spacing: -0.015em;
            }

            .card-description {
                font-size: 0.8125rem;
                color: var(--muted-foreground);
            }

            .card-content {
                padding: 1.25rem 1.5rem;
            }

            .card-footer {
                display: flex;
                align-items: center;
                padding: 1rem 1.5rem;
                border-top: 1px solid var(--border);
                background-color: rgba(0, 0, 0, 0.01);
            }

            [data-theme="dark"] .card-footer {
                background-color: rgba(255, 255, 255, 0.01);
            }

            /* --- Badges --- */
            .badge-shadcn {
                display: inline-flex;
                align-items: center;
                border-radius: 9999px;
                border: 1px solid transparent;
                padding: 0.125rem 0.55rem;
                font-size: 0.6875rem;
                font-weight: 600;
                line-height: 1rem;
                gap: 0.25rem;
            }

            .badge-default {
                background-color: var(--primary);
                color: var(--primary-foreground);
            }

            .badge-secondary {
                background-color: var(--secondary);
                color: var(--secondary-foreground);
                border-color: var(--border);
            }

            .badge-outline {
                border-color: var(--border);
                color: var(--foreground);
            }

            .badge-destructive {
                background-color: rgba(239, 68, 68, 0.12);
                color: #ef4444;
                border-color: rgba(239, 68, 68, 0.2);
            }

            .badge-success {
                background-color: rgba(16, 185, 129, 0.12);
                color: #10b981;
                border-color: rgba(16, 185, 129, 0.2);
            }

            .badge-warning {
                background-color: rgba(245, 158, 11, 0.12);
                color: #f59e0b;
                border-color: rgba(245, 158, 11, 0.2);
            }

            /* --- Form Inputs --- */
            .input-shadcn {
                width: 100%;
                border-radius: var(--radius);
                border: 1px solid var(--border);
                background-color: var(--background);
                padding: 0.45rem 0.75rem;
                font-size: 0.8125rem;
                color: var(--foreground);
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .input-shadcn::placeholder {
                color: var(--muted-foreground);
            }

            .input-shadcn:focus {
                outline: none;
                border-color: var(--ring);
                box-shadow: 0 0 0 2px rgba(24, 24, 27, 0.08);
            }

            [data-theme="dark"] .input-shadcn:focus {
                box-shadow: 0 0 0 2px rgba(244, 244, 245, 0.12);
            }

            /* --- Table Styles --- */
            .table-shadcn {
                width: 100%;
                caption-side: bottom;
                font-size: 0.8125rem;
                border-collapse: collapse;
            }

            .table-shadcn thead tr {
                border-bottom: 1px solid var(--border);
                background-color: rgba(0, 0, 0, 0.02);
            }

            [data-theme="dark"] .table-shadcn thead tr {
                background-color: rgba(255, 255, 255, 0.02);
            }

            .table-shadcn th {
                height: 2.5rem;
                padding: 0 1rem;
                text-align: left;
                vertical-align: middle;
                font-weight: 600;
                color: var(--muted-foreground);
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .table-shadcn td {
                padding: 0.85rem 1rem;
                vertical-align: middle;
                border-bottom: 1px solid var(--border);
                color: var(--foreground);
            }

            .table-shadcn tbody tr:hover {
                background-color: rgba(0, 0, 0, 0.015);
            }

            [data-theme="dark"] .table-shadcn tbody tr:hover {
                background-color: rgba(255, 255, 255, 0.02);
            }

            /* Custom Minimalist Scrollbars */
            ::-webkit-scrollbar {
                width: 5px;
                height: 5px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: #d4d4d8;
                border-radius: 4px;
            }

            [data-theme="dark"] ::-webkit-scrollbar-thumb {
                background: #3f3f46;
            }
        </style>
    </head>

    <body class="bg-[#fafafa] text-[#09090b] antialiased">
        <div class="relative z-10 flex h-screen overflow-hidden bg-[#fafafa] dark:bg-[#09090b]">
            {{template "admin_sidebar" .}}

            <!-- Main Content Column (Topbar + Scrollable Main View) -->
            <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#fafafa] dark:bg-[#09090b]">
                {{template "admin_topbar" .}}

                <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
                    {{end}}
