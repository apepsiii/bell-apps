{{template "admin_head" .}}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-zinc-900 p-5 rounded-xl border border-zinc-200/80 dark:border-zinc-800 shadow-xs">
    <div><div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-lg bg-violet-100 dark:bg-violet-950/40 text-violet-700 dark:text-violet-300 flex items-center justify-center"><i data-lucide="notebook-pen" class="w-4 h-4"></i></div><div><h1 class="text-lg font-bold text-zinc-900 dark:text-zinc-100">Approval Jurnal Guru</h1><p class="text-xs text-zinc-500 dark:text-zinc-400">Tinjau jurnal mengajar yang dikirim guru.</p></div></div></div>
    <select id="journalStatusFilter" onchange="loadAdminJournals()" class="rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 px-3 py-2 text-xs"><option value="submitted">Menunggu Approval</option><option value="all">Semua Status</option><option value="approved">Disetujui</option><option value="rejected">Ditolak</option><option value="draft">Draft</option></select>
</div>
<div id="adminJournalList" class="mt-5 space-y-3"><p class="text-xs text-zinc-500">Memuat jurnal...</p></div>
<script>
async function loadAdminJournals(){const status=document.getElementById('journalStatusFilter').value;const q=status==='all'?'':`?status=${status}`;const res=await fetch('/admin/journals/json'+q);const rows=await res.json();const list=document.getElementById('adminJournalList');if(!rows.length){list.innerHTML='<div class="p-8 text-center bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 text-xs text-zinc-500">Tidak ada jurnal.</div>';return;}list.innerHTML=rows.map(j=>`<article class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 p-5"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><div class="flex items-center gap-2"><h3 class="text-sm font-bold">${j.lesson_topic}</h3><span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800">${j.status}</span></div><p class="text-xs text-zinc-500 mt-1">${j.staff_name} · ${j.subject_name} · ${j.class_name} · ${j.journal_date}</p><p class="text-xs text-zinc-600 dark:text-zinc-300 mt-3">Presensi: ${j.attendance_summary||'{}'}</p></div>${j.status==='submitted'?`<div class="flex gap-2"><button onclick="approveJournal(${j.id})" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold">Setujui</button><button onclick="rejectJournal(${j.id})" class="px-3 py-2 rounded-lg bg-rose-600 text-white text-xs font-semibold">Tolak</button></div>`:''}</div>${j.rejection_reason?`<div class="mt-3 p-3 rounded-lg bg-rose-50 dark:bg-rose-950/30 text-xs text-rose-700 dark:text-rose-300">Alasan: ${j.rejection_reason}</div>`:''}</article>`).join('');}
async function approveJournal(id){if(!confirm('Setujui jurnal ini?'))return;await fetch(`/admin/journals/${id}/approve`,{method:'POST'});loadAdminJournals();}
async function rejectJournal(id){const reason=prompt('Alasan penolakan');if(!reason)return;const fd=new FormData();fd.append('reason',reason);await fetch(`/admin/journals/${id}/reject`,{method:'POST',body:fd});loadAdminJournals();}
loadAdminJournals();
</script>
{{template "admin_footer" .}}
