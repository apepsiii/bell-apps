<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tickets - Sarpras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            padding: 32px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
            font-weight: 400;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #404040;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: #1a1a1a;
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0;
        }

        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
        }

        .tab:hover {
            color: #1a1a1a;
        }

        .tab.active {
            color: #1a1a1a;
            border-bottom-color: #1a1a1a;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 24px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            padding: 14px 20px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-orange { background: #fed7aa; color: #9a3412; }
        .badge-gray { background: #f3f4f6; color: #374151; }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #9ca3af;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .alert {
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            border: 1px solid;
        }

        .alert-success {
            background: #f0fdf4;
            color: #065f46;
            border-color: #86efac;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }

        .close {
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
            line-height: 1;
            padding: 4px;
            transition: color 0.2s;
        }

        .close:hover {
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1>🔧 Maintenance Tickets</h1>
                    <p>Pelaporan & Tracking Perbaikan Aset</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <a href="/admin/sarpras" class="btn btn-secondary">← Kembali</a>
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Laporkan Masalah</button>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="tabs">
            <button class="tab active" onclick="filterByStatus('')">Semua</button>
            <button class="tab" onclick="filterByStatus('open')">Terbuka</button>
            <button class="tab" onclick="filterByStatus('in_progress')">Dalam Proses</button>
            <button class="tab" onclick="filterByStatus('resolved')">Selesai</button>
            <button class="tab" onclick="filterByStatus('closed')">Ditutup</button>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No. Tiket</th>
                            <th>Judul</th>
                            <th>Aset/Lokasi</th>
                            <th>Prioritas</th>
                            <th>Status</th>
                            <th>Dilaporkan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsBody">
                        <tr>
                            <td colspan="7" class="loading">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Create Ticket -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Laporkan Masalah</h2>
                <span class="close" onclick="closeCreateModal()">&times;</span>
            </div>
            <form id="ticketForm" onsubmit="createTicket(event)">
                <div class="form-group">
                    <label>Aset (Opsional)</label>
                    <select id="asset_id">
                        <option value="">Pilih aset (jika terkait aset spesifik)...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Lokasi</label>
                    <select id="location_id">
                        <option value="">Pilih lokasi...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Judul Masalah *</label>
                    <input type="text" id="title" required placeholder="Contoh: AC tidak dingin">
                </div>

                <div class="form-group">
                    <label>Deskripsi Detail *</label>
                    <textarea id="description" required placeholder="Jelaskan masalah secara detail..."></textarea>
                </div>

                <div class="form-group">
                    <label>Prioritas</label>
                    <select id="priority">
                        <option value="low">Rendah</option>
                        <option value="medium" selected>Sedang</option>
                        <option value="high">Tinggi</option>
                        <option value="urgent">Mendesak</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Update Status -->
    <div id="updateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Update Status Tiket</h2>
                <span class="close" onclick="closeUpdateModal()">&times;</span>
            </div>
            <form id="updateForm" onsubmit="updateTicket(event)">
                <input type="hidden" id="update_ticket_id">
                
                <div class="form-group">
                    <label>Status *</label>
                    <select id="update_status" required>
                        <option value="open">Terbuka</option>
                        <option value="in_progress">Dalam Proses</option>
                        <option value="resolved">Selesai</option>
                        <option value="closed">Ditutup</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Catatan Penyelesaian</label>
                    <textarea id="resolution_notes" placeholder="Jelaskan tindakan yang dilakukan..."></textarea>
                </div>

                <div class="form-group">
                    <label>Biaya Perbaikan (Rp)</label>
                    <input type="number" id="cost" step="0.01" placeholder="0">
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="closeUpdateModal()">Batal</button>
                    <button type="submit" class="btn btn-success">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allTickets = [];
        let currentStatus = '';

        async function loadAssets() {
            try {
                const response = await fetch('/admin/sarpras/api/assets');
                const assets = await response.json();
                
                const select = document.getElementById('asset_id');
                select.innerHTML = '<option value="">Pilih aset (jika terkait aset spesifik)...</option>' + 
                    assets.map(a => `<option value="${a.id}">${a.name} (${a.inventory_code})</option>`).join('');
            } catch (error) {
                console.error('Failed to load assets:', error);
            }
        }

        async function loadLocations() {
            try {
                const response = await fetch('/admin/sarpras/api/locations');
                const locations = await response.json();
                
                const select = document.getElementById('location_id');
                select.innerHTML = '<option value="">Pilih lokasi...</option>' + 
                    locations.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            } catch (error) {
                console.error('Failed to load locations:', error);
            }
        }

        async function loadTickets() {
            try {
                const url = currentStatus ? `/admin/sarpras/api/tickets?status=${currentStatus}` : '/admin/sarpras/api/tickets';
                const response = await fetch(url);
                allTickets = await response.json();
                renderTickets();
            } catch (error) {
                console.error('Failed to load tickets:', error);
                showAlert('Gagal memuat data tiket', 'error');
            }
        }

        function getStatusBadge(status) {
            const badges = {
                'open': { class: 'badge-blue', label: 'Terbuka' },
                'in_progress': { class: 'badge-yellow', label: 'Dalam Proses' },
                'resolved': { class: 'badge-green', label: 'Selesai' },
                'closed': { class: 'badge-gray', label: 'Ditutup' }
            };
            const badge = badges[status] || { class: 'badge-gray', label: status };
            return `<span class="badge ${badge.class}">${badge.label}</span>`;
        }

        function getPriorityBadge(priority) {
            const badges = {
                'low': { class: 'badge-green', label: 'Rendah' },
                'medium': { class: 'badge-blue', label: 'Sedang' },
                'high': { class: 'badge-orange', label: 'Tinggi' },
                'urgent': { class: 'badge-red', label: 'Mendesak' }
            };
            const badge = badges[priority] || { class: 'badge-gray', label: priority };
            return `<span class="badge ${badge.class}">${badge.label}</span>`;
        }

        function renderTickets() {
            const tbody = document.getElementById('ticketsBody');
            
            if (allTickets.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="icon">🔧</div>
                            <p>Tidak ada tiket maintenance</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = allTickets.map(t => `
                <tr>
                    <td><strong style="font-weight: 600;">${t.ticket_number}</strong></td>
                    <td>
                        <div style="font-weight: 500; color: #1a1a1a;">${t.title}</div>
                        <div style="font-size: 13px; color: #9ca3af; margin-top: 2px;">${t.description.substring(0, 50)}...</div>
                    </td>
                    <td>
                        ${t.asset_name ? `<div style="font-weight: 500;">${t.asset_name}</div>` : ''}
                        <div style="font-size: 13px; color: #9ca3af;">${t.location_name || '-'}</div>
                    </td>
                    <td>${getPriorityBadge(t.priority)}</td>
                    <td>${getStatusBadge(t.status)}</td>
                    <td>
                        <div style="font-size: 13px;">${new Date(t.reported_at).toLocaleDateString('id-ID')}</div>
                        <div style="font-size: 12px; color: #9ca3af;">${t.reporter_name}</div>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="openUpdateModal(${t.id}, '${t.status}')">Update</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTicket(${t.id})">Hapus</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterByStatus(status) {
            currentStatus = status;
            
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            loadTickets();
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
            loadAssets();
            loadLocations();
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('ticketForm').reset();
        }

        function openUpdateModal(id, currentStatus) {
            document.getElementById('update_ticket_id').value = id;
            document.getElementById('update_status').value = currentStatus;
            document.getElementById('updateModal').classList.add('active');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.remove('active');
            document.getElementById('updateForm').reset();
        }

        async function createTicket(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append('asset_id', document.getElementById('asset_id').value);
            formData.append('location_id', document.getElementById('location_id').value);
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('priority', document.getElementById('priority').value);
            formData.append('reported_by', '1');

            try {
                const response = await fetch('/admin/sarpras/api/ticket/create', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(`Tiket berhasil dibuat! No: ${result.ticket_number}`, 'success');
                    closeCreateModal();
                    loadTickets();
                } else {
                    showAlert(result.error || 'Gagal membuat tiket', 'error');
                }
            } catch (error) {
                console.error('Failed to create ticket:', error);
                showAlert('Gagal membuat tiket', 'error');
            }
        }

        async function updateTicket(event) {
            event.preventDefault();

            const id = document.getElementById('update_ticket_id').value;
            const formData = new FormData();
            formData.append('status', document.getElementById('update_status').value);
            formData.append('resolution_notes', document.getElementById('resolution_notes').value);
            formData.append('cost', document.getElementById('cost').value);

            try {
                const response = await fetch(`/admin/sarpras/api/ticket/${id}/update`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Tiket berhasil diupdate', 'success');
                    closeUpdateModal();
                    loadTickets();
                } else {
                    showAlert(result.error || 'Gagal update tiket', 'error');
                }
            } catch (error) {
                console.error('Failed to update ticket:', error);
                showAlert('Gagal update tiket', 'error');
            }
        }

        async function deleteTicket(id) {
            if (!confirm('Hapus tiket ini?')) return;

            try {
                const response = await fetch(`/admin/sarpras/api/ticket/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Tiket berhasil dihapus', 'success');
                    loadTickets();
                } else {
                    showAlert(result.error || 'Gagal menghapus tiket', 'error');
                }
            } catch (error) {
                console.error('Failed to delete ticket:', error);
                showAlert('Gagal menghapus tiket', 'error');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">${message}</div>
            `;

            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        loadTickets();
    </script>
</body>
</html>
