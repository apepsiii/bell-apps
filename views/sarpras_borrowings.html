<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman Aset - Sarpras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Archivo Black', sans-serif;
            color: #1a1a1a;
            font-size: 24px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f9fafb;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-weight: 600;
            color: #374151;
        }

        td {
            color: #6b7280;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-gray { background: #f3f4f6; color: #374151; }

        .actions {
            display: flex;
            gap: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #1a1a1a;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            line-height: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🤝 Peminjaman Aset</h1>
                <p style="color: #6b7280; font-size: 14px; margin-top: 4px;">Manajemen Peminjaman Barang & Ruangan</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/sarpras" class="btn btn-secondary">← Kembali</a>
                <button class="btn btn-primary" onclick="openCreateModal()">+ Buat Peminjaman</button>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="tabs">
            <div class="tab active" onclick="filterByStatus('')">Semua</div>
            <div class="tab" onclick="filterByStatus('pending')">Pending</div>
            <div class="tab" onclick="filterByStatus('approved')">Disetujui</div>
            <div class="tab" onclick="filterByStatus('borrowed')">Dipinjam</div>
            <div class="tab" onclick="filterByStatus('returned')">Dikembalikan</div>
            <div class="tab" onclick="filterByStatus('rejected')">Ditolak</div>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Aset</th>
                            <th>Peminjam</th>
                            <th>Tujuan</th>
                            <th>Tanggal Pinjam</th>
                            <th>Jatuh Tempo</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="borrowingsBody">
                        <tr>
                            <td colspan="7" class="loading">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Create Borrowing -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Buat Peminjaman Baru</h2>
                <span class="close" onclick="closeCreateModal()">&times;</span>
            </div>
            <form id="borrowingForm" onsubmit="createBorrowing(event)">
                <div class="form-group">
                    <label>Aset yang Dipinjam *</label>
                    <select id="asset_id" required>
                        <option value="">Pilih aset...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipe Peminjam *</label>
                    <select id="borrower_type" required onchange="loadBorrowers()">
                        <option value="">Pilih tipe...</option>
                        <option value="staff">Staff</option>
                        <option value="student">Siswa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Peminjam *</label>
                    <select id="borrower_id" required>
                        <option value="">Pilih peminjam...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tujuan Peminjaman *</label>
                    <textarea id="purpose" required placeholder="Jelaskan tujuan peminjaman..."></textarea>
                </div>

                <div class="form-group">
                    <label>Tanggal Mulai *</label>
                    <input type="date" id="borrow_date" required>
                </div>

                <div class="form-group">
                    <label>Tanggal Jatuh Tempo *</label>
                    <input type="date" id="due_date" required>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allBorrowings = [];
        let currentStatus = '';

        async function loadBorrowableAssets() {
            try {
                const response = await fetch('/admin/sarpras/api/assets'');
                const assets = await response.json();
                const borrowable = assets.filter(a => a.is_borrowable && a.condition === 'good');
                
                const select = document.getElementById('asset_id');
                select.innerHTML = '<option value="">Pilih aset...</option>' + 
                    borrowable.map(a => `<option value="${a.id}">${a.name} (${a.inventory_code})</option>`).join('');
            } catch (error) {
                console.error('Failed to load assets:', error);
            }
        }

        async function loadBorrowers() {
            const type = document.getElementById('borrower_type').value;
            const select = document.getElementById('borrower_id');
            
            if (!type) {
                select.innerHTML = '<option value="">Pilih peminjam...</option>';
                return;
            }

            try {
                const endpoint = type === 'staff' ? '/admin/staff/json' : '/admin/students/json';
                const response = await fetch(endpoint);
                const data = await response.json();
                
                select.innerHTML = '<option value="">Pilih peminjam...</option>' + 
                    data.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            } catch (error) {
                console.error('Failed to load borrowers:', error);
            }
        }

        async function loadBorrowings() {
            try {
                const url = currentStatus ? `/admin/sarpras/borrowings?status=${currentStatus}` : '/admin/sarpras/api/borrowing's';
                const response = await fetch(url);
                allBorrowings = await response.json();
                renderBorrowings();
            } catch (error) {
                console.error('Failed to load borrowings:', error);
                showAlert('Gagal memuat data peminjaman', 'error');
            }
        }

        function getStatusBadge(status) {
            const badges = {
                'pending': { class: 'badge-yellow', label: 'Pending' },
                'approved': { class: 'badge-blue', label: 'Disetujui' },
                'rejected': { class: 'badge-red', label: 'Ditolak' },
                'borrowed': { class: 'badge-green', label: 'Dipinjam' },
                'returned': { class: 'badge-gray', label: 'Dikembalikan' },
                'overdue': { class: 'badge-red', label: 'Terlambat' }
            };
            const badge = badges[status] || { class: 'badge-gray', label: status };
            return `<span class="badge ${badge.class}">${badge.label}</span>`;
        }

        function renderBorrowings() {
            const tbody = document.getElementById('borrowingsBody');
            
            if (allBorrowings.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="icon">🤝</div>
                            <p>Tidak ada data peminjaman</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = allBorrowings.map(b => `
                <tr>
                    <td><strong>${b.asset_name}</strong></td>
                    <td>
                        <div><strong>${b.borrower_name}</strong></div>
                        <div style="font-size: 11px; color: #9ca3af;">${b.borrower_type === 'staff' ? 'Staff' : 'Siswa'}</div>
                    </td>
                    <td>${b.purpose}</td>
                    <td>${new Date(b.borrow_date).toLocaleDateString('id-ID')}</td>
                    <td>${new Date(b.due_date).toLocaleDateString('id-ID')}</td>
                    <td>${getStatusBadge(b.status)}</td>
                    <td>
                        <div class="actions">
                            ${b.status === 'pending' ? `
                                <button class="btn btn-success btn-sm" onclick="approveBorrowing(${b.id})">✓ Setuju</button>
                                <button class="btn btn-danger btn-sm" onclick="rejectBorrowing(${b.id})">✗ Tolak</button>
                            ` : ''}
                            ${b.status === 'approved' || b.status === 'borrowed' ? `
                                <button class="btn btn-primary btn-sm" onclick="returnBorrowing(${b.id})">↩ Kembalikan</button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterByStatus(status) {
            currentStatus = status;
            
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadBorrowings();
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
            loadBorrowableAssets();
            
            // Set default dates
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(nextWeek.getDate() + 7);
            
            document.getElementById('borrow_date').value = today.toISOString().split('T')[0];
            document.getElementById('due_date').value = nextWeek.toISOString().split('T')[0];
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('borrowingForm').reset();
        }

        async function createBorrowing(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append('asset_id', document.getElementById('asset_id').value);
            formData.append('borrower_type', document.getElementById('borrower_type').value);
            formData.append('borrower_id', document.getElementById('borrower_id').value);
            formData.append('purpose', document.getElementById('purpose').value);
            formData.append('borrow_date', document.getElementById('borrow_date').value);
            formData.append('due_date', document.getElementById('due_date').value);

            try {
                const response = await fetch('/admin/sarpras/api/borrowing'/create', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Peminjaman berhasil dibuat', 'success');
                    closeCreateModal();
                    loadBorrowings();
                } else {
                    showAlert(result.error || 'Gagal membuat peminjaman', 'error');
                }
            } catch (error) {
                console.error('Failed to create borrowing:', error);
                showAlert('Gagal membuat peminjaman', 'error');
            }
        }

        async function approveBorrowing(id) {
            if (!confirm('Setujui peminjaman ini?')) return;

            const formData = new FormData();
            formData.append('approved_by', '1'); // TODO: Get from session

            try {
                const response = await fetch(`/admin/sarpras/borrowing/${id}/approve`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Peminjaman disetujui', 'success');
                    loadBorrowings();
                } else {
                    showAlert(result.error || 'Gagal menyetujui', 'error');
                }
            } catch (error) {
                console.error('Failed to approve:', error);
                showAlert('Gagal menyetujui peminjaman', 'error');
            }
        }

        async function rejectBorrowing(id) {
            const reason = prompt('Alasan penolakan:');
            if (!reason) return;

            const formData = new FormData();
            formData.append('reason', reason);

            try {
                const response = await fetch(`/admin/sarpras/borrowing/${id}/reject`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Peminjaman ditolak', 'success');
                    loadBorrowings();
                } else {
                    showAlert(result.error || 'Gagal menolak', 'error');
                }
            } catch (error) {
                console.error('Failed to reject:', error);
                showAlert('Gagal menolak peminjaman', 'error');
            }
        }

        async function returnBorrowing(id) {
            const condition = prompt('Kondisi saat dikembalikan:\n\ngood = Baik\nfair = Cukup Baik\npoor = Kurang Baik\nbroken = Rusak', 'good');
            if (!condition) return;

            const notes = prompt('Catatan pengembalian (opsional):');

            const formData = new FormData();
            formData.append('return_condition', condition);
            if (notes) formData.append('return_notes', notes);

            try {
                const response = await fetch(`/admin/sarpras/borrowing/${id}/return`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Aset berhasil dikembalikan', 'success');
                    loadBorrowings();
                } else {
                    showAlert(result.error || 'Gagal mengembalikan', 'error');
                }
            } catch (error) {
                console.error('Failed to return:', error);
                showAlert('Gagal mengembalikan aset', 'error');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">${message}</div>
            `;

            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        loadBorrowings();
    </script>
</body>
</html>
