<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Aset - Sarpras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; padding: 32px; line-height: 1.6; }
        .container { max-width: 1600px; margin: 0 auto; }
        .header { margin-bottom: 40px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
        .header p { color: #6b7280; font-size: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: #1a1a1a; color: white; }
        .btn-primary:hover { background: #404040; transform: translateY(-1px); }
        .btn-secondary { background: white; color: #1a1a1a; border: 1px solid #e5e7eb; }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 7px 14px; font-size: 13px; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 20px; border-bottom: 1px solid #f3f4f6; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #374151; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
        th { padding: 14px 20px; text-align: left; font-weight: 600; color: #374151; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px 20px; color: #4b5563; border-bottom: 1px solid #f3f4f6; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }
        .badge { display: inline-flex; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f3f4f6; color: #374151; }
        .actions { display: flex; gap: 8px; }
        .empty-state { text-align: center; padding: 80px 20px; color: #9ca3af; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .loading { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .alert { padding: 14px 20px; border-radius: 10px; margin-bottom: 24px; font-size: 14px; border: 1px solid; }
        .alert-success { background: #f0fdf4; color: #065f46; border-color: #86efac; }
        .alert-error { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
        .count-bar { padding: 14px 20px; border-bottom: 1px solid #f3f4f6; font-size: 14px; color: #6b7280; }
        .price { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #059669; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1>📦 Daftar Aset</h1>
                    <p>Data Inventaris Barang Sekolah</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <a href="/admin/sarpras" class="btn btn-secondary">← Kembali</a>
                    <a href="/admin/sarpras/asset/add" class="btn btn-primary">+ Tambah Aset</a>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="filters">
                <div class="form-group">
                    <label>Pencarian</label>
                    <input type="text" id="searchInput" placeholder="Nama, kode, merk..." oninput="filterAssets()">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="categoryFilter" onchange="filterAssets()">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lokasi</label>
                    <select id="locationFilter" onchange="filterAssets()">
                        <option value="">Semua Lokasi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kondisi</label>
                    <select id="conditionFilter" onchange="filterAssets()">
                        <option value="">Semua Kondisi</option>
                        <option value="good">Baik</option>
                        <option value="fair">Cukup Baik</option>
                        <option value="poor">Kurang Baik</option>
                        <option value="broken">Rusak</option>
                        <option value="disposed">Dihapus</option>
                    </select>
                </div>
            </div>

            <div class="count-bar">
                <span id="assetCount">0</span> aset ditemukan
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Kode Inventaris</th>
                            <th>Nama Aset</th>
                            <th>Kategori</th>
                            <th>Lokasi</th>
                            <th>Kondisi</th>
                            <th>Harga</th>
                            <th>Qty</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="assetsBody">
                        <tr><td colspan="8" class="loading">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allAssets = [];
        let filteredAssets = [];

        async function loadCategories() {
            try {
                const res = await fetch('/admin/sarpras/api/categories');
                const data = await res.json();
                document.getElementById('categoryFilter').innerHTML = '<option value="">Semua Kategori</option>' + 
                    data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (e) {}
        }

        async function loadLocations() {
            try {
                const res = await fetch('/admin/sarpras/api/locations');
                const data = await res.json();
                document.getElementById('locationFilter').innerHTML = '<option value="">Semua Lokasi</option>' + 
                    data.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            } catch (e) {}
        }

        async function loadAssets() {
            try {
                const res = await fetch('/admin/sarpras/api/assets');
                allAssets = await res.json();
                filteredAssets = allAssets;
                renderAssets();
            } catch (e) {
                showAlert('Gagal memuat data aset', 'error');
            }
        }

        function getConditionBadge(c) {
            const map = {
                'good': ['badge-green', 'Baik'],
                'fair': ['badge-blue', 'Cukup Baik'],
                'poor': ['badge-yellow', 'Kurang Baik'],
                'broken': ['badge-red', 'Rusak'],
                'disposed': ['badge-gray', 'Dihapus']
            };
            const [cls, label] = map[c] || ['badge-gray', c];
            return `<span class="badge ${cls}">${label}</span>`;
        }

        function filterAssets() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const loc = document.getElementById('locationFilter').value;
            const cond = document.getElementById('conditionFilter').value;

            filteredAssets = allAssets.filter(a => {
                const matchSearch = !search || a.name.toLowerCase().includes(search) || 
                    a.inventory_code.toLowerCase().includes(search) ||
                    (a.brand && a.brand.toLowerCase().includes(search));
                return matchSearch &&
                    (!cat || a.category_id == cat) &&
                    (!loc || a.location_id == loc) &&
                    (!cond || a.condition === cond);
            });
            renderAssets();
        }

        function renderAssets() {
            const tbody = document.getElementById('assetsBody');
            document.getElementById('assetCount').textContent = filteredAssets.length;

            if (filteredAssets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><div class="icon">📦</div><p>Tidak ada aset ditemukan</p></td></tr>`;
                return;
            }

            tbody.innerHTML = filteredAssets.map(a => `
                <tr>
                    <td><strong style="font-weight:600;color:#1a1a1a;">${a.inventory_code}</strong></td>
                    <td>
                        <div style="font-weight:500;color:#1a1a1a;">${a.name}</div>
                        ${a.brand ? `<div style="font-size:12px;color:#9ca3af;">${a.brand}</div>` : ''}
                    </td>
                    <td><span class="badge badge-blue">${a.category_name || '-'}</span></td>
                    <td>${a.location_name || '-'}</td>
                    <td>${getConditionBadge(a.condition)}</td>
                    <td><span class="price">Rp ${(a.purchase_price || 0).toLocaleString('id-ID')}</span></td>
                    <td>${a.quantity} ${a.unit || 'unit'}</td>
                    <td>
                        <div class="actions">
                            <a href="/admin/sarpras/asset/${a.id}" class="btn btn-primary btn-sm">Detail</a>
                            <button class="btn btn-danger btn-sm" onclick="deleteAsset(${a.id}, '${a.name}')">Hapus</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteAsset(id, name) {
            if (!confirm(`Hapus aset "${name}"?`)) return;
            try {
                const res = await fetch(`/admin/sarpras/api/asset/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (res.ok) {
                    showAlert('Aset berhasil dihapus', 'success');
                    loadAssets();
                } else {
                    showAlert(result.error || 'Gagal menghapus aset', 'error');
                }
            } catch (e) {
                showAlert('Gagal menghapus aset', 'error');
            }
        }

        function showAlert(message, type) {
            const el = document.getElementById('alertContainer');
            el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        loadCategories();
        loadLocations();
        loadAssets();
    </script>
</body>
</html>
