<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Aset - Sarpras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; padding: 32px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
        .header p { color: #6b7280; font-size: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: #1a1a1a; color: white; }
        .btn-primary:hover { background: #404040; transform: translateY(-1px); }
        .btn-secondary { background: white; color: #1a1a1a; border: 1px solid #e5e7eb; }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; margin-bottom: 24px; }
        .section-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f3f4f6; letter-spacing: -0.2px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #374151; font-size: 14px; }
        .form-group label .required { color: #ef4444; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; transition: all 0.2s ease; background: white; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #1a1a1a; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group small { display: block; margin-top: 4px; color: #9ca3af; font-size: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; padding-top: 24px; border-top: 1px solid #f3f4f6; }
        .alert { padding: 14px 20px; border-radius: 10px; margin-bottom: 24px; font-size: 14px; border: 1px solid; }
        .alert-success { background: #f0fdf4; color: #065f46; border-color: #86efac; }
        .alert-error { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Tambah Aset Baru</h1>
            <p>Input data inventaris barang sekolah</p>
        </div>

        <div id="alertContainer"></div>

        <form id="assetForm" onsubmit="saveAsset(event)">
            <div class="card">
                <div class="section-title">📋 Informasi Dasar</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kategori Aset <span class="required">*</span></label>
                        <select id="category_id" required>
                            <option value="">Pilih kategori...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nama Aset <span class="required">*</span></label>
                        <input type="text" id="name" required placeholder="Contoh: Laptop Dell Latitude">
                    </div>
                </div>
                <div class="form-group">
                    <label>Spesifikasi</label>
                    <textarea id="specification" placeholder="Deskripsi detail spesifikasi aset..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Merk/Tipe</label>
                        <input type="text" id="brand" placeholder="Contoh: Dell">
                    </div>
                    <div class="form-group">
                        <label>Nomor Seri</label>
                        <input type="text" id="serial_number" placeholder="Contoh: DL12345">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">💰 Informasi Pengadaan</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tahun Pengadaan <span class="required">*</span></label>
                        <input type="number" id="acquisition_year" required min="2000" max="2100" placeholder="2026">
                        <small>Kode inventaris di-generate otomatis berdasarkan tahun</small>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Pengadaan</label>
                        <input type="date" id="acquisition_date">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Harga Perolehan (Rp)</label>
                        <input type="number" id="purchase_price" step="0.01" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Sumber Dana</label>
                        <select id="funding_source_id">
                            <option value="">Pilih sumber dana...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">📍 Lokasi & Penanggung Jawab</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Lokasi</label>
                        <select id="location_id">
                            <option value="">Pilih lokasi...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Penanggung Jawab (Staff)</label>
                        <select id="pic_staff_id">
                            <option value="">Pilih staff...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">📊 Status & Kondisi</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kondisi</label>
                        <select id="condition">
                            <option value="good">Baik</option>
                            <option value="fair">Cukup Baik</option>
                            <option value="poor">Kurang Baik</option>
                            <option value="broken">Rusak</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Jumlah <span class="required">*</span></label>
                        <input type="number" id="quantity" value="1" min="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Satuan</label>
                        <select id="unit">
                            <option value="unit">Unit</option>
                            <option value="pcs">Pcs</option>
                            <option value="set">Set</option>
                            <option value="box">Box</option>
                            <option value="kg">Kg</option>
                            <option value="liter">Liter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status Peminjaman</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="is_borrowable" value="1">
                            <label for="is_borrowable">Bisa dipinjam oleh staff/siswa</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Catatan</label>
                    <textarea id="notes" placeholder="Catatan tambahan tentang aset..."></textarea>
                </div>

                <div class="form-actions">
                    <a href="/admin/sarpras/assets" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-success">💾 Simpan Aset</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('acquisition_year').value = new Date().getFullYear();

        async function loadFormData() {
            try {
                const [catRes, fundRes, locRes, staffRes] = await Promise.all([
                    fetch('/admin/sarpras/api/categories'),
                    fetch('/admin/sarpras/api/funding-sources'),
                    fetch('/admin/sarpras/api/locations'),
                    fetch('/admin/staff/json')
                ]);

                const [cats, funds, locs, staff] = await Promise.all([
                    catRes.json(), fundRes.json(), locRes.json(), staffRes.json()
                ]);

                document.getElementById('category_id').innerHTML = '<option value="">Pilih kategori...</option>' +
                    cats.map(c => `<option value="${c.id}">${c.code} - ${c.name}</option>`).join('');

                document.getElementById('funding_source_id').innerHTML = '<option value="">Pilih sumber dana...</option>' +
                    funds.map(f => `<option value="${f.id}">${f.name}</option>`).join('');

                document.getElementById('location_id').innerHTML = '<option value="">Pilih lokasi...</option>' +
                    locs.map(l => `<option value="${l.id}">${l.name}</option>`).join('');

                document.getElementById('pic_staff_id').innerHTML = '<option value="">Pilih staff...</option>' +
                    staff.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

            } catch (e) {
                showAlert('Gagal memuat data form', 'error');
            }
        }

        async function saveAsset(event) {
            event.preventDefault();

            const formData = new FormData();
            ['category_id','name','specification','brand','serial_number','acquisition_year',
             'acquisition_date','purchase_price','funding_source_id','location_id','pic_staff_id',
             'condition','quantity','unit','notes'].forEach(id => {
                formData.append(id, document.getElementById(id).value);
            });
            formData.append('is_borrowable', document.getElementById('is_borrowable').checked ? '1' : '0');

            try {
                const res = await fetch('/admin/sarpras/api/asset/add', { method: 'POST', body: formData });
                const result = await res.json();

                if (res.ok) {
                    showAlert(`Aset berhasil ditambahkan! Kode: ${result.inventory_code}`, 'success');
                    setTimeout(() => window.location.href = '/admin/sarpras/assets', 2000);
                } else {
                    showAlert(result.error || 'Gagal menyimpan aset', 'error');
                }
            } catch (e) {
                showAlert('Gagal menyimpan aset', 'error');
            }
        }

        function showAlert(message, type) {
            const el = document.getElementById('alertContainer');
            el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            window.scrollTo(0, 0);
        }

        loadFormData();
    </script>
</body>
</html>
