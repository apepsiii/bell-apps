<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Lokasi - Sarpras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Archivo Black', sans-serif;
            color: #1a1a1a;
            font-size: 24px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        td {
            color: #6b7280;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-purple {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .badge-green {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-yellow {
            background: #fef3c7;
            color: #92400e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #1a1a1a;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            line-height: 1;
        }

        .close:hover {
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📍 Lokasi & Ruangan</h1>
                <p style="color: #6b7280; font-size: 14px; margin-top: 4px;">Manajemen Lokasi Penyimpanan Aset</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/sarpras" class="btn btn-secondary">← Kembali</a>
                <button class="btn btn-primary" onclick="openAddModal()">+ Tambah Lokasi</button>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Nama Lokasi</th>
                            <th>Tipe</th>
                            <th>Kapasitas</th>
                            <th>Penanggung Jawab</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="locationsBody">
                        <tr>
                            <td colspan="7" class="loading">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit -->
    <div id="locationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Lokasi</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="locationForm" onsubmit="saveLocation(event)">
                <input type="hidden" id="locationId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Kode Lokasi *</label>
                        <input type="text" id="code" required placeholder="R-001, LAB-01">
                    </div>

                    <div class="form-group">
                        <label>Tipe Lokasi</label>
                        <select id="type">
                            <option value="">Pilih tipe</option>
                            <option value="classroom">Ruang Kelas</option>
                            <option value="lab">Laboratorium</option>
                            <option value="library">Perpustakaan</option>
                            <option value="office">Ruang Kantor</option>
                            <option value="warehouse">Gudang</option>
                            <option value="other">Lainnya</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nama Lokasi *</label>
                    <input type="text" id="name" required placeholder="Ruang Kelas 7A">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kapasitas</label>
                        <input type="number" id="capacity" placeholder="36">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="active">Aktif</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="closed">Ditutup</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Penanggung Jawab (Staff)</label>
                    <select id="pic_staff_id">
                        <option value="">Pilih staff</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let locations = [];
        let staffList = [];

        async function loadStaff() {
            try {
                const response = await fetch('/admin/staff/json');
                staffList = await response.json();
                
                const select = document.getElementById('pic_staff_id');
                select.innerHTML = '<option value="">Pilih staff</option>' + 
                    staffList.map(s => `<option value="${s.id}">${s.name} - ${s.role || 'Staff'}</option>`).join('');
            } catch (error) {
                console.error('Failed to load staff:', error);
            }
        }

        async function loadLocations() {
            try {
                const response = await fetch('/admin/sarpras/api/locations');
                locations = await response.json();
                renderLocations();
            } catch (error) {
                console.error('Failed to load locations:', error);
                showAlert('Gagal memuat data lokasi', 'error');
            }
        }

        function getStatusBadge(status) {
            const badges = {
                'active': 'badge-green',
                'maintenance': 'badge-yellow',
                'closed': 'badge-red'
            };
            const labels = {
                'active': 'Aktif',
                'maintenance': 'Maintenance',
                'closed': 'Ditutup'
            };
            return `<span class="badge ${badges[status] || 'badge-green'}">${labels[status] || status}</span>`;
        }

        function getTypeLabel(type) {
            const labels = {
                'classroom': 'Ruang Kelas',
                'lab': 'Laboratorium',
                'library': 'Perpustakaan',
                'office': 'Ruang Kantor',
                'warehouse': 'Gudang',
                'other': 'Lainnya'
            };
            return labels[type] || type || '-';
        }

        function renderLocations() {
            const tbody = document.getElementById('locationsBody');
            
            if (locations.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="icon">📍</div>
                            <p>Belum ada lokasi</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = locations.map(loc => `
                <tr>
                    <td><span class="badge badge-purple">${loc.code}</span></td>
                    <td><strong>${loc.name}</strong></td>
                    <td>${getTypeLabel(loc.type)}</td>
                    <td>${loc.capacity || '-'}</td>
                    <td>${loc.pic_name || '-'}</td>
                    <td>${getStatusBadge(loc.status)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="editLocation(${loc.id})">Edit</button>
                            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteLocation(${loc.id}, '${loc.name}')">Hapus</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Tambah Lokasi';
            document.getElementById('locationForm').reset();
            document.getElementById('locationId').value = '';
            document.getElementById('status').value = 'active';
            document.getElementById('locationModal').classList.add('active');
        }

        function editLocation(id) {
            const location = locations.find(l => l.id === id);
            if (!location) return;

            document.getElementById('modalTitle').textContent = 'Edit Lokasi';
            document.getElementById('locationId').value = id;
            document.getElementById('code').value = location.code;
            document.getElementById('name').value = location.name;
            document.getElementById('type').value = location.type || '';
            document.getElementById('capacity').value = location.capacity || '';
            document.getElementById('pic_staff_id').value = location.pic_staff_id || '';
            document.getElementById('status').value = location.status;
            document.getElementById('locationModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('locationModal').classList.remove('active');
            document.getElementById('locationForm').reset();
        }

        async function saveLocation(event) {
            event.preventDefault();

            const id = document.getElementById('locationId').value;
            const formData = new FormData();
            formData.append('code', document.getElementById('code').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('type', document.getElementById('type').value);
            formData.append('capacity', document.getElementById('capacity').value);
            formData.append('pic_staff_id', document.getElementById('pic_staff_id').value);
            formData.append('status', document.getElementById('status').value);

            try {
                const url = id ? `/admin/sarpras/location/update/${id}` : '/admin/sarpras/api/location/add';
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(id ? 'Lokasi berhasil diupdate' : 'Lokasi berhasil ditambahkan', 'success');
                    closeModal();
                    loadLocations();
                } else {
                    showAlert(result.error || 'Gagal menyimpan lokasi', 'error');
                }
            } catch (error) {
                console.error('Failed to save location:', error);
                showAlert('Gagal menyimpan lokasi', 'error');
            }
        }

        async function deleteLocation(id, name) {
            if (!confirm(`Hapus lokasi "${name}"?\n\nPeringatan: Lokasi yang memiliki aset tidak bisa dihapus.`)) {
                return;
            }

            try {
                const response = await fetch(`/admin/sarpras/location/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Lokasi berhasil dihapus', 'success');
                    loadLocations();
                } else {
                    showAlert(result.error || 'Gagal menghapus lokasi', 'error');
                }
            } catch (error) {
                console.error('Failed to delete location:', error);
                showAlert('Gagal menghapus lokasi', 'error');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">${message}</div>
            `;

            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        loadStaff();
        loadLocations();
    </script>
</body>
</html>
