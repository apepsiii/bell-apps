<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Poin Siswa - SMK NIBA Super Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .slide-in { animation: slideIn 0.4s ease-out forwards; opacity: 0; }
        
        .podium-winner {
            animation: bounce 2s ease-in-out infinite;
        }
        
        .medal-shine {
            position: relative;
            overflow: hidden;
        }
        
        .medal-shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shine 3s infinite;
        }
        
        .rank-row {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .rank-row:hover {
            transform: translateX(8px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-amber-50 to-orange-50 min-h-screen">
    <div class="min-h-screen">
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 text-white shadow-2xl">
            <div class="max-w-7xl mx-auto px-6 py-8">
                <div class="flex items-center justify-between">
                    <div class="fade-in">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="bg-white/20 backdrop-blur-sm p-3 rounded-xl medal-shine">
                                <i class="fas fa-trophy text-3xl"></i>
                            </div>
                            <div>
                                <h1 class="text-3xl font-black tracking-tight">Leaderboard Poin Siswa</h1>
                                <p class="text-amber-100 text-sm mt-1 flex items-center gap-2">
                                    <i class="fas fa-crown text-xs"></i>
                                    Ranking Siswa Berdasarkan Poin Penghargaan
                                </p>
                            </div>
                        </div>
                    </div>
                    <a href="/admin/dual-point/dashboard" class="bg-white/90 backdrop-blur text-amber-600 px-6 py-3 rounded-xl hover:bg-white hover:shadow-lg transition-all duration-300 font-semibold">
                        <i class="fas fa-arrow-left mr-2"></i>Kembali
                    </a>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-6 py-8">
            <!-- Filters -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-gray-100 fade-in" style="animation-delay: 0.1s;">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                            <i class="fas fa-calendar text-purple-500"></i>
                            Tahun Ajaran
                        </label>
                        <select id="academic-year" onchange="loadLeaderboard()" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all font-medium hover:border-amber-300">
                            <option value="">Tahun Ajaran Saat Ini</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                            <i class="fas fa-school text-blue-500"></i>
                            Filter Kelas
                        </label>
                        <select id="filter-class" onchange="filterLeaderboard()" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all font-medium hover:border-amber-300">
                            <option value="">Semua Kelas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                            <i class="fas fa-award text-emerald-500"></i>
                            Filter Predikat
                        </label>
                        <select id="filter-grade" onchange="filterLeaderboard()" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all font-medium hover:border-amber-300">
                            <option value="">Semua Predikat</option>
                            <option value="waluya">🏆 Waluya Utama (≥151)</option>
                            <option value="hadiah">🎁 Sertifikat + Hadiah (126-150)</option>
                            <option value="sertifikat">📜 Sertifikat (100-125)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Podium Top 3 -->
            <div id="podium" class="mb-8 fade-in" style="animation-delay: 0.2s;">
                <div class="grid grid-cols-3 gap-6 max-w-5xl mx-auto items-end">
                    <!-- 2nd Place -->
                    <div class="flex flex-col items-center">
                        <div id="podium-2" class="text-center mb-4 w-full"></div>
                        <div class="bg-gradient-to-t from-gray-400 via-gray-300 to-gray-200 rounded-t-2xl p-6 w-full text-center shadow-2xl border-4 border-gray-300 relative overflow-hidden h-32">
                            <div class="absolute inset-0 bg-gradient-to-br from-white/30 to-transparent"></div>
                            <div class="relative">
                                <i class="fas fa-medal text-white text-4xl mb-2 drop-shadow-lg"></i>
                                <div class="text-white font-black text-5xl drop-shadow-lg">2</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 1st Place -->
                    <div class="flex flex-col items-center">
                        <div id="podium-1" class="text-center mb-4 w-full podium-winner"></div>
                        <div class="bg-gradient-to-t from-amber-500 via-yellow-400 to-yellow-300 rounded-t-2xl p-8 w-full text-center shadow-2xl border-4 border-amber-400 relative overflow-hidden h-40 medal-shine">
                            <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent"></div>
                            <div class="relative">
                                <i class="fas fa-crown text-white text-5xl mb-3 drop-shadow-lg animate-pulse"></i>
                                <div class="text-white font-black text-6xl drop-shadow-lg">1</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 3rd Place -->
                    <div class="flex flex-col items-center">
                        <div id="podium-3" class="text-center mb-4 w-full"></div>
                        <div class="bg-gradient-to-t from-orange-500 via-orange-400 to-orange-300 rounded-t-2xl p-6 w-full text-center shadow-2xl border-4 border-orange-400 relative overflow-hidden h-28">
                            <div class="absolute inset-0 bg-gradient-to-br from-white/30 to-transparent"></div>
                            <div class="relative">
                                <i class="fas fa-medal text-white text-4xl mb-2 drop-shadow-lg"></i>
                                <div class="text-white font-black text-5xl drop-shadow-lg">3</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Leaderboard Table -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 fade-in" style="animation-delay: 0.3s;">
                <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-6 border-b-2 border-amber-200">
                    <h2 class="font-bold text-xl text-gray-800 flex items-center gap-3">
                        <div class="bg-gradient-to-br from-amber-500 to-orange-500 text-white p-2 rounded-lg">
                            <i class="fas fa-list"></i>
                        </div>
                        Ranking Lengkap
                    </h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b-2 border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Rank</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Nama</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Kelas</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Poin Penghargaan</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Predikat</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Poin Pelanggaran</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="bg-white divide-y divide-gray-100">
                            <tr>
                                <td colspan="8" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin text-2xl mr-2 text-amber-500"></i>
                                    <p class="mt-2 font-semibold">Memuat data...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        async function loadLeaderboard() {
            const year = document.getElementById('academic-year').value;
            
            try {
                const res = await fetch(`/admin/v2/leaderboard?year=${year}`);
                allData = await res.json();
                
                // Extract unique classes
                const classes = [...new Set(allData.map(s => s.class_name).filter(c => c))];
                const classSelect = document.getElementById('filter-class');
                classSelect.innerHTML = '<option value="">Semua Kelas</option>' + 
                    classes.map(c => `<option value="${c}">${c}</option>`).join('');
                
                filterLeaderboard();
            } catch (err) {
                console.error('Error loading leaderboard:', err);
                document.getElementById('leaderboard-body').innerHTML = `
                    <tr><td colspan="8" class="px-6 py-8 text-center text-red-500">
                        <i class="fas fa-exclamation-circle mr-2"></i>Gagal memuat data
                    </td></tr>
                `;
            }
        }

        function filterLeaderboard() {
            const filterClass = document.getElementById('filter-class').value;
            const filterGrade = document.getElementById('filter-grade').value;
            
            filteredData = allData.filter(s => {
                if (filterClass && s.class_name !== filterClass) return false;
                
                if (filterGrade) {
                    if (filterGrade === 'waluya' && s.achievement_points < 151) return false;
                    if (filterGrade === 'hadiah' && (s.achievement_points < 126 || s.achievement_points >= 151)) return false;
                    if (filterGrade === 'sertifikat' && (s.achievement_points < 100 || s.achievement_points >= 126)) return false;
                }
                
                return true;
            });
            
            renderLeaderboard();
        }

        function renderLeaderboard() {
            // Render podium (top 3)
            if (filteredData.length >= 1) {
                document.getElementById('podium-1').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-2xl p-6 border-4 border-amber-400 transform hover:scale-105 transition-transform">
                        <div class="w-24 h-24 mx-auto mb-3 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-full flex items-center justify-center text-white text-3xl font-black shadow-xl border-4 border-white">
                            ${filteredData[0].name.charAt(0).toUpperCase()}
                        </div>
                        <p class="font-black text-xl text-gray-800 truncate">${filteredData[0].name}</p>
                        <p class="text-sm text-gray-500 flex items-center justify-center gap-1 mt-1">
                            <i class="fas fa-graduation-cap"></i>
                            ${filteredData[0].class_name}
                        </p>
                        <div class="mt-4 bg-amber-50 rounded-xl p-3 border-2 border-amber-200">
                            <p class="text-amber-600 font-black text-2xl">${filteredData[0].achievement_points}</p>
                            <p class="text-xs text-amber-700 font-bold uppercase">Poin</p>
                        </div>
                    </div>
                `;
            }
            
            if (filteredData.length >= 2) {
                document.getElementById('podium-2').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl p-5 border-4 border-gray-300 transform hover:scale-105 transition-transform">
                        <div class="w-20 h-20 mx-auto mb-3 bg-gradient-to-br from-gray-400 to-gray-500 rounded-full flex items-center justify-center text-white text-2xl font-black shadow-lg border-4 border-white">
                            ${filteredData[1].name.charAt(0).toUpperCase()}
                        </div>
                        <p class="font-bold text-lg text-gray-800 truncate">${filteredData[1].name}</p>
                        <p class="text-xs text-gray-500 flex items-center justify-center gap-1 mt-1">
                            <i class="fas fa-graduation-cap"></i>
                            ${filteredData[1].class_name}
                        </p>
                        <div class="mt-3 bg-gray-50 rounded-xl p-2 border-2 border-gray-200">
                            <p class="text-gray-600 font-bold text-xl">${filteredData[1].achievement_points}</p>
                            <p class="text-xs text-gray-600 font-bold uppercase">Poin</p>
                        </div>
                    </div>
                `;
            }
            
            if (filteredData.length >= 3) {
                document.getElementById('podium-3').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl p-5 border-4 border-orange-300 transform hover:scale-105 transition-transform">
                        <div class="w-20 h-20 mx-auto mb-3 bg-gradient-to-br from-orange-400 to-orange-500 rounded-full flex items-center justify-center text-white text-2xl font-black shadow-lg border-4 border-white">
                            ${filteredData[2].name.charAt(0).toUpperCase()}
                        </div>
                        <p class="font-bold text-lg text-gray-800 truncate">${filteredData[2].name}</p>
                        <p class="text-xs text-gray-500 flex items-center justify-center gap-1 mt-1">
                            <i class="fas fa-graduation-cap"></i>
                            ${filteredData[2].class_name}
                        </p>
                        <div class="mt-3 bg-orange-50 rounded-xl p-2 border-2 border-orange-200">
                            <p class="text-orange-600 font-bold text-xl">${filteredData[2].achievement_points}</p>
                            <p class="text-xs text-orange-600 font-bold uppercase">Poin</p>
                        </div>
                    </div>
                `;
            }
            
            // Render table
            const tbody = document.getElementById('leaderboard-body');
            
            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8" class="px-6 py-12 text-center text-gray-500">
                        <i class="fas fa-info-circle text-4xl mb-3 text-gray-300"></i>
                        <p class="font-semibold">Tidak ada data</p>
                    </td></tr>
                `;
                return;
            }
            
            tbody.innerHTML = filteredData.map((s, idx) => {
                const rank = idx + 1;
                const medalIcon = rank === 1 ? '<i class="fas fa-crown text-amber-500 text-xl"></i>' : 
                                 rank === 2 ? '<i class="fas fa-medal text-gray-400 text-xl"></i>' : 
                                 rank === 3 ? '<i class="fas fa-medal text-orange-400 text-xl"></i>' : 
                                 `<span class="text-lg font-bold text-gray-600">${rank}</span>`;
                const rowBg = rank <= 3 ? (rank === 1 ? 'bg-amber-50' : rank === 2 ? 'bg-gray-50' : 'bg-orange-50') : '';
                
                return `
                    <tr class="rank-row hover:bg-gradient-to-r hover:from-amber-50 hover:to-transparent ${rowBg}">
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="flex items-center gap-2">
                                ${medalIcon}
                            </div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold shadow-md">
                                    ${s.name.charAt(0).toUpperCase()}
                                </div>
                                <div class="font-bold text-gray-800">${s.name}</div>
                            </div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap">
                            <span class="text-sm text-gray-600 font-medium flex items-center gap-2">
                                <i class="fas fa-graduation-cap text-blue-400"></i>
                                ${s.class_name}
                            </span>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-center">
                            <div class="inline-flex items-center gap-2 bg-emerald-50 px-4 py-2 rounded-xl border-2 border-emerald-200">
                                <i class="fas fa-trophy text-emerald-500"></i>
                                <span class="text-xl font-black text-emerald-600">${s.achievement_points}</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-center">
                            <span class="inline-flex items-center px-4 py-2 rounded-xl text-sm font-bold shadow-sm ${
                                s.achievement_points >= 151 ? 'bg-gradient-to-r from-amber-400 to-yellow-500 text-white' :
                                s.achievement_points >= 126 ? 'bg-gradient-to-r from-emerald-400 to-teal-500 text-white' :
                                s.achievement_points >= 100 ? 'bg-gradient-to-r from-blue-400 to-cyan-500 text-white' :
                                'bg-gray-200 text-gray-700'
                            }">
                                ${s.achievement_grade}
                            </span>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-center">
                            <div class="inline-flex items-center gap-2 ${s.violation_points >= 25 ? 'bg-red-50 px-4 py-2 rounded-xl border-2 border-red-200' : ''}">
                                ${s.violation_points >= 25 ? '<i class="fas fa-exclamation-triangle text-red-500"></i>' : ''}
                                <span class="text-xl font-black ${s.violation_points >= 25 ? 'text-red-600' : 'text-gray-300'}">${s.violation_points}</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-center">
                            ${s.violation_points >= 25 ? `
                                <span class="inline-flex items-center px-4 py-2 rounded-xl text-sm font-bold shadow-sm ${
                                    s.violation_points >= 76 ? 'bg-gradient-to-r from-red-500 to-red-600 text-white' :
                                    s.violation_points >= 51 ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white' :
                                    'bg-gradient-to-r from-yellow-400 to-yellow-500 text-white'
                                }">
                                    ${s.violation_level}
                                </span>
                            ` : '<span class="inline-flex items-center px-4 py-2 rounded-xl text-sm font-bold bg-gradient-to-r from-green-400 to-emerald-500 text-white shadow-sm">✓ Aman</span>'}
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-center">
                            <a href="/admin/dual-point/student/${s.id}?id=${s.id}" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-semibold text-sm transition-all shadow-md hover:shadow-lg">
                                <i class="fas fa-eye"></i> Detail
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Initialize
        loadLeaderboard();
    </script>
</body>
</html>
