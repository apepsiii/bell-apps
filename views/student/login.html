<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk — SMK NIBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #0B57C2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Background blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
        }
        .blob-1 { width: 400px; height: 400px; background: #60A5FA; top: -100px; right: -80px; }
        .blob-2 { width: 300px; height: 300px; background: #1E40AF; bottom: -60px; left: -60px; }
        .blob-3 { width: 200px; height: 200px; background: #93C5FD; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Card */
        .card {
            width: 100%;
            max-width: 380px;
            padding: 0 20px 32px;
            position: relative;
            z-index: 10;
        }

        /* Logo area */
        .logo-wrap {
            text-align: center;
            padding: 32px 0 28px;
        }
        .logo-icon {
            width: 72px; height: 72px;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            backdrop-filter: blur(8px);
        }
        .logo-title {
            font-size: 26px; font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1;
            margin-bottom: 4px;
        }
        .logo-sub {
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Form panel */
        .panel {
            background: #fff;
            border-radius: 24px;
            padding: 28px 24px 24px;
            box-shadow: 0 32px 64px -16px rgba(0,0,0,0.35);
        }
        .panel-title {
            font-size: 20px; font-weight: 800;
            color: #0F172A;
            margin: 0 0 4px;
        }
        .panel-sub {
            font-size: 13px;
            color: #64748B;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        /* Input */
        .field { margin-bottom: 14px; }
        .field-label {
            display: block;
            font-size: 12px; font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .input-wrap {
            display: flex; align-items: center;
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: 14px;
            transition: all 0.15s;
        }
        .input-wrap:focus-within {
            border-color: #0B57C2;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(11,87,194,0.1);
        }
        .input-icon {
            width: 44px; display: flex; align-items: center; justify-content: center;
            color: #94A3B8; font-size: 18px; flex-shrink: 0;
        }
        .input-wrap input {
            flex: 1; border: none; outline: none;
            background: transparent;
            padding: 13px 4px 13px 0;
            font-size: 15px; color: #0F172A;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .input-wrap input::placeholder { color: #CBD5E1; font-weight: 400; }
        .toggle-btn {
            width: 44px; display: flex; align-items: center; justify-content: center;
            color: #94A3B8; font-size: 18px; cursor: pointer;
            background: none; border: none; flex-shrink: 0;
            transition: color 0.15s;
        }
        .toggle-btn:active { transform: scale(0.9); }

        /* Error */
        .error-box {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #DC2626;
            font-weight: 500;
            align-items: center;
            gap: 8px;
        }
        .shake { animation: shake 0.35s ease; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-5px); }
            40%,80% { transform: translateX(5px); }
        }

        /* Button */
        .btn-submit {
            width: 100%;
            background: #0B57C2;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 16px -4px rgba(11,87,194,0.5);
        }
        .btn-submit:hover { background: #0a4eaf; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0 0;
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            font-weight: 500;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">
        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon">
                <i class="ph-fill ph-graduation-cap" style="font-size:34px; color:#fff;"></i>
            </div>
            <div class="logo-title">SMK NIBA</div>
            <div class="logo-sub">Super Apps</div>
        </div>

        <!-- Panel -->
        <div class="panel">
            <p class="panel-title">Selamat datang 👋</p>
            <p class="panel-sub">Masukkan NIS dan PIN kamu untuk melanjutkan.</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label class="field-label" for="nis">NIS / NISN</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="ph ph-identification-card"></i></span>
                        <input type="text" id="nis" inputmode="numeric" autocomplete="off" placeholder="Nomor Induk Siswa" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="pin">PIN</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="ph ph-lock-simple"></i></span>
                        <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••" required>
                        <button type="button" class="toggle-btn" onclick="togglePin()" aria-label="Tampilkan PIN">
                            <i class="ph ph-eye-slash" id="togglePinIcon"></i>
                        </button>
                    </div>
                </div>

                <div id="errorBox" class="error-box">
                    <i class="ph ph-warning-circle" style="font-size:16px; flex-shrink:0;"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" id="loginBtn" class="btn-submit">
                    <span id="btnText">Masuk</span>
                    <span id="btnSpinner" class="spinner" style="display:none;"></span>
                </button>
            </form>
        </div>
    </div>

    <p class="footer">&copy; 2026 SMK NIBA Super Apps</p>

    <script>
        const form = document.getElementById('loginForm');
        const nisEl = document.getElementById('nis');
        const pinEl = document.getElementById('pin');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        window.addEventListener('load', () => nisEl.focus());

        nisEl.addEventListener('input', () => {
            nisEl.value = nisEl.value.replace(/[^0-9]/g, '');
            if (nisEl.value.length >= 6) pinEl.focus();
        });
        pinEl.addEventListener('input', () => {
            pinEl.value = pinEl.value.replace(/[^0-9]/g, '');
        });

        function togglePin() {
            const i = document.getElementById('togglePinIcon');
            if (pinEl.type === 'password') {
                pinEl.type = 'text';
                i.classList.replace('ph-eye-slash', 'ph-eye');
            } else {
                pinEl.type = 'password';
                i.classList.replace('ph-eye', 'ph-eye-slash');
            }
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.style.display = 'flex';
            errorBox.classList.remove('shake');
            void errorBox.offsetWidth;
            errorBox.classList.add('shake');
        }
        function hideError() { errorBox.style.display = 'none'; }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const nis = nisEl.value.trim();
            const pin = pinEl.value.trim();
            if (!nis) { showError('NIS / NISN wajib diisi'); nisEl.focus(); return; }
            if (!pin) { showError('PIN wajib diisi'); pinEl.focus(); return; }

            btn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';

            const fd = new FormData();
            fd.set('nis', nis);
            fd.set('pin', pin);

            try {
                const r = await fetch('/api/student/login', { method: 'POST', body: fd });
                const d = await r.json();
                if (r.ok) {
                    btnText.textContent = 'Berhasil...';
                    btnText.style.display = 'block';
                    btnSpinner.style.display = 'none';
                    window.location.href = '/student/app';
                } else {
                    showError(d.message || 'NIS atau PIN salah');
                    btn.disabled = false;
                    btnText.style.display = 'block';
                    btnSpinner.style.display = 'none';
                    pinEl.value = '';
                    pinEl.focus();
                }
            } catch {
                showError('Tidak dapat terhubung ke server. Coba lagi.');
                btn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
