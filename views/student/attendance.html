<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riwayat Presensi — SMK NIBA Super Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #0F5132;
            --emerald-light: #1A7A4C;
            --emerald-soft: #E8F3EE;
            --gold: #C9A227;
            --gold-soft: #F5EEDC;
            --cream: #FAF7F0;
            --ink: #1A2E25;
            --muted: #6B7F76;
        }
        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        body { background: var(--cream); color: var(--ink); padding-bottom: 80px; }
        .card {
            background: #FFFFFF;
            border: 1px solid rgba(15,81,50,0.08);
            border-radius: 18px;
            box-shadow: 0 1px 3px rgba(15,81,50,0.04);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #FFFFFF;
            border-top: 1px solid rgba(15,81,50,0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 64px;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--muted); font-size: 11px; font-weight: 500;
            transition: color 0.15s; gap: 3px;
        }
        .nav-item.active { color: var(--emerald); }
        .nav-qr {
            position: relative; top: -14px;
            width: 48px; height: 48px;
            background: var(--emerald);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(15,81,50,0.3);
        }
        .skeleton { background: linear-gradient(90deg, #e8f3ee 0%, #f0f5f2 50%, #e8f3ee 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .cal-day {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
            cursor: default;
        }
        .cal-hadir { background: var(--emerald-soft); color: var(--emerald); font-weight: 700; }
        .cal-terlambat { background: var(--gold-soft); color: #8B6914; font-weight: 700; }
        .cal-sakit { background: #FEF2F2; color: #DC2626; }
        .cal-izin { background: #EFF6FF; color: #2563EB; }
        .cal-alpha { background: #F3F4F6; color: #9CA3AF; font-weight: 700; }
        .cal-empty { color: #D1D5DB; }
        .cal-weekend { color: #D1D5DB; }
        .cal-today-box { border: 2px solid var(--emerald); }
    </style>
</head>
<body>
    <div class="px-5 pt-6 pb-4">
        <h1 class="text-xl font-bold text-[var(--ink)] mb-1">Riwayat Presensi</h1>
        <p class="text-sm text-[var(--muted)] mb-4">Pantau kehadiran Anda setiap bulan</p>

        <!-- Month Selector -->
        <div class="flex items-center justify-between mb-4">
            <button onclick="prevMonth()" class="w-10 h-10 rounded-xl bg-white border border-[rgba(15,81,50,0.08)] flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5 text-[var(--ink)]"></i></button>
            <span id="monthLabel" class="text-base font-semibold text-[var(--ink)]"></span>
            <button onclick="nextMonth()" class="w-10 h-10 rounded-xl bg-white border border-[rgba(15,81,50,0.08)] flex items-center justify-center"><i data-lucide="chevron-right" class="w-5 h-5 text-[var(--ink)]"></i></button>
        </div>

        <!-- Calendar Grid -->
        <div class="card p-4 mb-4">
            <div class="grid grid-cols-7 text-center text-xs font-semibold text-[var(--muted)] mb-3">
                <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
            </div>
            <div id="calGrid" class="grid grid-cols-7 gap-y-2 justify-items-center"></div>
            <div class="flex flex-wrap gap-2 mt-4 text-xs text-[var(--muted)]">
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-md bg-[var(--emerald-soft)]"></span>Hadir</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-md bg-[var(--gold-soft)]"></span>Terlambat</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-md bg-red-50"></span>Sakit</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-md bg-blue-50"></span>Izin</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-md bg-gray-100"></span>Alpha</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="card p-4 mb-4">
            <span class="text-xs uppercase tracking-widest font-semibold text-[var(--muted)]">Ringkasan Bulan Ini</span>
            <div class="flex gap-2 mt-3 text-center text-xs">
                <div class="flex-1 py-2 rounded-xl bg-[var(--emerald-soft)]"><div id="sPresent" class="font-bold text-[var(--emerald)] text-lg font-mono">0</div>Hadir</div>
                <div class="flex-1 py-2 rounded-xl bg-[var(--gold-soft)]"><div id="sLate" class="font-bold text-[#8B6914] text-lg font-mono">0</div>Terlambat</div>
                <div class="flex-1 py-2 rounded-xl bg-red-50"><div id="sSick" class="font-bold text-red-500 text-lg font-mono">0</div>Sakit</div>
                <div class="flex-1 py-2 rounded-xl bg-blue-50"><div id="sPerm" class="font-bold text-blue-600 text-lg font-mono">0</div>Izin</div>
                <div class="flex-1 py-2 rounded-xl bg-gray-100"><div id="sAlpha" class="font-bold text-gray-500 text-lg font-mono">0</div>Alpha</div>
            </div>
            <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
                <span class="text-sm text-[var(--muted)]">Tingkat Kehadiran</span>
                <span id="rate" class="font-bold font-mono text-[var(--emerald)]"></span>
            </div>
            <div class="flex items-center justify-between mt-1.5">
                <span class="text-sm text-[var(--muted)]">Hari Kerja Efektif</span>
                <span id="workDays" class="font-mono text-sm text-[var(--ink)]"></span>
            </div>
        </div>

        <div class="text-center text-xs text-[var(--muted)] mt-4 pb-2">&copy; 2026 SMK NIBA Super Apps</div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/student/dashboard" class="nav-item"><i data-lucide="home" class="w-5 h-5"></i>Beranda</a>
        <a href="/student/presensi" class="nav-item active"><i data-lucide="calendar-check" class="w-5 h-5"></i>Presensi</a>
        <a href="/student/qr" class="nav-qr"><i data-lucide="qr-code" class="w-6 h-6"></i></a>
        <a href="/student/profil" class="nav-item"><i data-lucide="user" class="w-5 h-5"></i>Profil</a>
    </nav>

    <script>
        lucide.createIcons();
        var currentDate = new Date();
        var month = currentDate.getMonth() + 1;
        var year = currentDate.getFullYear();

        function loadCalendar() {
            var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
            document.getElementById('monthLabel').textContent = getMonthName(month) + ' ' + year;

            fetch('/api/student/calendar?month=' + pad(month) + '&year=' + year)
                .then(function(r) {
                    if (!r.ok) throw new Error('Unauthorized');
                    return r.json();
                })
                .then(function(d) {
                    renderCalendar(d.calendar || {});
                    document.getElementById('sPresent').textContent = d.stats.present;
                    document.getElementById('sLate').textContent = d.stats.late;
                    document.getElementById('sSick').textContent = d.stats.sick;
                    document.getElementById('sPerm').textContent = d.stats.permission;
                    document.getElementById('sAlpha').textContent = d.stats.alpha;
                    document.getElementById('rate').textContent = (d.stats.attendance_rate || 0).toFixed(1) + '%';
                    document.getElementById('workDays').textContent = d.stats.working_days;
                })
                .catch(function(e) {
                    if (e.message === 'Unauthorized') window.location.href = '/student/login';
                });
        }

        function renderCalendar(calendarData) {
            var grid = document.getElementById('calGrid');
            var firstDay = new Date(year, month - 1, 1).getDay();
            var daysInMonth = new Date(year, month, 0).getDate();
            var today = new Date();
            var isCurrentMonth = (month === today.getMonth() + 1 && year === today.getFullYear());
            var todayDay = today.getDate();

            var html = '';
            for (var i = 0; i < firstDay; i++) {
                html += '<div></div>';
            }
            for (var day = 1; day <= daysInMonth; day++) {
                var logs = calendarData[day] || [];
                var cls = 'cal-day cal-empty';
                var tooltip = '';

                if (logs.length > 0) {
                    var statuses = logs.map(function(l) { return l.Status; });
                    if (statuses.indexOf('Terlambat') >= 0) {
                        cls = 'cal-day cal-terlambat';
                        tooltip = 'Terlambat';
                    } else if (statuses.indexOf('Datang') >= 0 || statuses.indexOf('Hadir') >= 0) {
                        cls = 'cal-day cal-hadir';
                        tooltip = 'Hadir';
                    } else if (statuses.indexOf('Sakit') >= 0) {
                        cls = 'cal-day cal-sakit';
                        tooltip = 'Sakit';
                    } else if (statuses.indexOf('Izin') >= 0) {
                        cls = 'cal-day cal-izin';
                        tooltip = 'Izin';
                    } else if (statuses.indexOf('Alpha') >= 0) {
                        cls = 'cal-day cal-alpha';
                        tooltip = 'Alpha';
                    }
                    tooltip += '; ' + logs.map(function(l) { return l.Time; }).join(', ');
                }

                if (isCurrentMonth && day === todayDay) {
                    cls += ' cal-today-box';
                }

                var dayOfWeek = new Date(year, month - 1, day).getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    if (cls.indexOf('cal-hadir') < 0 && cls.indexOf('cal-terlambat') < 0 && cls.indexOf('cal-sakit') < 0 && cls.indexOf('cal-izin') < 0 && cls.indexOf('cal-alpha') < 0) {
                        cls = 'cal-day cal-weekend';
                    }
                }

                html += '<div class="' + cls + '" title="' + tooltip + '">' + day + '</div>';
            }
            grid.innerHTML = html;
        }

        function getMonthName(m) {
            return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m - 1];
        }

        function prevMonth() {
            month--;
            if (month < 1) { month = 12; year--; }
            loadCalendar();
        }
        function nextMonth() {
            month++;
            if (month > 12) { month = 1; year++; }
            loadCalendar();
        }

        loadCalendar();
    </script>
</body>
</html>
