<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Aset - Sarpras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; padding: 32px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: #1a1a1a; color: white; }
        .btn-primary:hover { background: #404040; transform: translateY(-1px); }
        .btn-secondary { background: white; color: #1a1a1a; border: 1px solid #e5e7eb; }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .content-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; margin-bottom: 24px; }
        .section-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f3f4f6; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .detail-item .label { font-size: 12px; color: #9ca3af; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .detail-item .value { font-size: 15px; color: #1a1a1a; font-weight: 500; }
        .inventory-code { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px 20px; border-radius: 8px; display: inline-block; margin-bottom: 20px; color: #1a1a1a; letter-spacing: 1px; }
        .price { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #059669; }
        .badge { display: inline-flex; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f3f4f6; color: #374151; }
        .qr-container { text-align: center; padding: 8px 0 20px; }
        .qr-container img { width: 200px; height: 200px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 8px; }
        .qr-actions { display: flex; flex-direction: column; gap: 10px; }
        .quick-actions { display: flex; flex-direction: column; gap: 10px; }
        .loading { text-align: center; padding: 80px 20px; color: #9ca3af; font-size: 15px; }
        .alert { padding: 14px 20px; border-radius: 10px; margin-bottom: 24px; font-size: 14px; border: 1px solid; }
        .alert-error { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
        @media print {
            body { background: white; padding: 0; }
            .header, .quick-actions, .btn { display: none; }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="assetTitle">Detail Aset</h1>
            <div style="display: flex; gap: 12px;">
                <a href="/admin/sarpras/assets" class="btn btn-secondary">← Kembali</a>
                <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
            </div>
        </div>

        <div id="alertContainer"></div>
        <div id="contentContainer" class="loading">Memuat data...</div>
    </div>

    <script>
        const assetId = window.location.pathname.split('/').pop();

        function getConditionBadge(c) {
            const map = {
                'good': ['badge-green', 'Baik'],
                'fair': ['badge-blue', 'Cukup Baik'],
                'poor': ['badge-yellow', 'Kurang Baik'],
                'broken': ['badge-red', 'Rusak'],
                'disposed': ['badge-gray', 'Dihapus']
            };
            const [cls, label] = map[c] || ['badge-gray', c];
            return `<span class="badge ${cls}">${label}</span>`;
        }

        async function loadAssetDetail() {
            try {
                const res = await fetch(`/admin/sarpras/api/asset/${assetId}`);
                if (!res.ok) throw new Error('Not found');
                const asset = await res.json();
                renderAssetDetail(asset);
            } catch (e) {
                document.getElementById('contentContainer').innerHTML = `
                    <div class="alert alert-error">Gagal memuat data aset. Aset mungkin tidak ditemukan.</div>`;
            }
        }

        function renderAssetDetail(a) {
            document.getElementById('assetTitle').textContent = a.name;
            document.getElementById('contentContainer').className = 'content-grid';
            document.getElementById('contentContainer').innerHTML = `
                <div>
                    <div class="card">
                        <div class="section-title">📋 Informasi Dasar</div>
                        <div class="inventory-code">${a.inventory_code}</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="label">Nama Aset</div>
                                <div class="value">${a.name}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Kategori</div>
                                <div class="value"><span class="badge badge-blue">${a.category_name || '-'}</span></div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Merk/Tipe</div>
                                <div class="value">${a.brand || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Nomor Seri</div>
                                <div class="value">${a.serial_number || '-'}</div>
                            </div>
                        </div>
                        ${a.specification ? `
                        <div class="detail-item" style="margin-top: 16px;">
                            <div class="label">Spesifikasi</div>
                            <div class="value" style="font-size:14px;color:#4b5563;margin-top:4px;">${a.specification}</div>
                        </div>` : ''}
                    </div>

                    <div class="card">
                        <div class="section-title">💰 Informasi Pengadaan</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="label">Tahun Pengadaan</div>
                                <div class="value">${a.acquisition_year || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Tanggal Pengadaan</div>
                                <div class="value">${a.acquisition_date ? new Date(a.acquisition_date).toLocaleDateString('id-ID') : '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Harga Perolehan</div>
                                <div class="value"><span class="price">Rp ${(a.purchase_price || 0).toLocaleString('id-ID')}</span></div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Sumber Dana</div>
                                <div class="value"><span class="badge badge-green">${a.funding_source || '-'}</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="section-title">📍 Lokasi & Pengelolaan</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="label">Lokasi</div>
                                <div class="value">${a.location_name || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Penanggung Jawab</div>
                                <div class="value">${a.pic_name || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Kondisi</div>
                                <div class="value">${getConditionBadge(a.condition)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Jumlah</div>
                                <div class="value">${a.quantity} ${a.unit || 'unit'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Status Peminjaman</div>
                                <div class="value">${a.is_borrowable ? '<span class="badge badge-green">Bisa Dipinjam</span>' : '<span class="badge badge-gray">Tidak Bisa Dipinjam</span>'}</div>
                            </div>
                        </div>
                        ${a.notes ? `
                        <div class="detail-item" style="margin-top:16px;">
                            <div class="label">Catatan</div>
                            <div class="value" style="font-size:14px;color:#4b5563;margin-top:4px;">${a.notes}</div>
                        </div>` : ''}
                    </div>
                </div>

                <div>
                    <div class="card">
                        <div class="section-title">QR Code</div>
                        <div class="qr-container">
                            <img src="/admin/sarpras/api/asset/${a.id}/qr" alt="QR Code">
                            <p style="font-size:12px;color:#9ca3af;margin-top:12px;">${a.inventory_code}</p>
                        </div>
                        <div class="qr-actions">
                            <a href="/admin/sarpras/api/asset/${a.id}/qr" download="${a.inventory_code}.png" class="btn btn-primary" style="justify-content:center;">📥 Download QR</a>
                            <button class="btn btn-secondary" onclick="window.print()" style="justify-content:center;">🖨️ Print Label</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="section-title">⚡ Quick Actions</div>
                        <div class="quick-actions">
                            ${a.is_borrowable ? `<a href="/admin/sarpras/borrowings" class="btn btn-success" style="justify-content:center;">🤝 Ajukan Peminjaman</a>` : ''}
                            <a href="/admin/sarpras/maintenance" class="btn btn-warning" style="justify-content:center;">🔧 Laporkan Kerusakan</a>
                            <a href="/admin/sarpras/asset/add" class="btn btn-secondary" style="justify-content:center;">✏️ Edit Aset</a>
                            <button class="btn btn-danger" style="justify-content:center;" onclick="deleteAsset()">🗑️ Hapus Aset</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function deleteAsset() {
            const title = document.getElementById('assetTitle').textContent;
            if (!confirm(`Hapus aset "${title}"?\n\nAset dengan peminjaman aktif tidak bisa dihapus.`)) return;
            try {
                const res = await fetch(`/admin/sarpras/api/asset/${assetId}`, { method: 'DELETE' });
                const result = await res.json();
                if (res.ok) {
                    alert('Aset berhasil dihapus');
                    window.location.href = '/admin/sarpras/assets';
                } else {
                    alert(result.error || 'Gagal menghapus aset');
                }
            } catch (e) {
                alert('Gagal menghapus aset');
            }
        }

        loadAssetDetail();
    </script>
</body>
</html>
