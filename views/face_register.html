<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Wajah - SMK NIBA Super Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Modern Vladmandic Face-API (Fast & Lightweight) -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .face-oval {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 190px;
            height: 250px;
            border: 2px dashed #64748b;
            border-radius: 50%;
            pointer-events: none;
            transition: border-color 0.2s;
        }
        .face-oval.detected {
            border-color: #10b981;
            border-style: solid;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .mirror-video {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
            <div class="flex items-center gap-3">
                <a href="/admin/student/{{.ID}}" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div>
                    <h1 class="font-bold text-lg text-white">Registrasi Wajah Siswa</h1>
                    <p class="text-xs text-slate-400">{{.Name}} • {{.ExtraInfo}} • NIS: {{.IdentityNo}}</p>
                </div>
            </div>
            <div id="model-badge" class="text-[11px] px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full font-medium">
                Memuat AI...
            </div>
        </div>

        <!-- Camera Frame -->
        <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center border border-slate-800 mb-4">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover mirror-video"></video>
            <div class="face-oval" id="face-oval"></div>

            <div class="absolute bottom-3 inset-x-0 flex justify-center">
                <span id="prompt-text" class="bg-slate-950/80 backdrop-blur border border-slate-700 text-xs px-3.5 py-1 rounded-full text-slate-200">
                    Posisikan wajah tepat di dalam lingkaran oval
                </span>
            </div>
        </div>

        <!-- Progress Counter & Thumbnails -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-4">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-slate-400 font-medium">Sample Wajah:</span>
                <span id="count-text" class="text-xs font-bold text-blue-400 font-mono">0 / 3 Sample</span>
            </div>
            <div class="grid grid-cols-3 gap-2" id="thumb-container">
                <div class="aspect-video bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-600 text-xs" id="box-0">Sample 1</div>
                <div class="aspect-video bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-600 text-xs" id="box-1">Sample 2</div>
                <div class="aspect-video bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-600 text-xs" id="box-2">Sample 3</div>
            </div>
        </div>

        <!-- Error Banner -->
        <div id="error-box" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3 mb-4 text-xs text-red-400"></div>

        <!-- Actions -->
        <div class="flex gap-2">
            <button id="btn-snap" onclick="takeSnapshot()" disabled
                class="flex-1 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition">
                <i data-lucide="camera" class="w-4 h-4"></i> Ambil Foto (<span id="btn-count">0/3</span>)
            </button>
            <button id="btn-reset" onclick="resetSnapshots()"
                class="px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button id="btn-save" onclick="saveFaceData()" disabled
                class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-500 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition">
                <i data-lucide="check" class="w-4 h-4"></i> Simpan Wajah
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const USER_ID = {{.ID}};
        const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

        let mediaStream = null;
        let isReady = false;
        let currentDetection = null;
        let samples = [];

        const video = document.getElementById('video');
        const faceOval = document.getElementById('face-oval');
        const promptText = document.getElementById('prompt-text');
        const modelBadge = document.getElementById('model-badge');
        const btnSnap = document.getElementById('btn-snap');
        const btnSave = document.getElementById('btn-save');
        const countText = document.getElementById('count-text');
        const btnCount = document.getElementById('btn-count');
        const errorBox = document.getElementById('error-box');

        // Helper to get CSRF token from cookies
        function getCsrfToken() {
            const match = document.cookie.match(new RegExp('(^| )csrf_token=([^;]+)'));
            return match ? match[2] : '';
        }

        async function init() {
            try {
                // Load Lightweight Tiny Models (< 250 KB total!)
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                isReady = true;
                modelBadge.className = 'text-[11px] px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full font-medium';
                modelBadge.innerText = 'AI Ringan Siap';

                // Start Camera with optimal lightweight resolution
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: 'user' }
                });
                video.srcObject = mediaStream;

                startLoop();
            } catch (err) {
                console.error("Init error:", err);
                showErr("Gagal memuat kamera atau model AI. Periksa koneksi internet / izin kamera.");
            }
        }

        // Lightweight detection loop (4 FPS)
        async function startLoop() {
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });

            const check = async () => {
                if (isReady && video.readyState === 4 && samples.length < 3) {
                    try {
                        const result = await faceapi
                            .detectSingleFace(video, detectorOptions)
                            .withFaceLandmarks(true)
                            .withFaceDescriptor();

                        currentDetection = result;

                        if (result) {
                            faceOval.classList.add('detected');
                            promptText.innerText = "Wajah Terdeteksi! Klik 'Ambil Foto'";
                            btnSnap.disabled = false;
                        } else {
                            faceOval.classList.remove('detected');
                            promptText.innerText = "Posisikan wajah tepat di dalam lingkaran oval";
                            btnSnap.disabled = true;
                        }
                    } catch (e) {
                        // ignore dropped frame
                    }
                }
                setTimeout(check, 250); // hemat daya & CPU
            };
            check();
        }

        function takeSnapshot() {
            if (!currentDetection || samples.length >= 3) return;

            samples.push(Array.from(currentDetection.descriptor));

            // Thumbnail
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 120;
            canvas.getContext('2d').drawImage(video, 0, 0, 160, 120);
            
            const idx = samples.length - 1;
            const box = document.getElementById(`box-${idx}`);
            box.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.7)}" class="w-full h-full object-cover rounded-lg mirror-video">`;
            box.className = 'aspect-video border border-emerald-500/50 rounded-lg overflow-hidden';

            countText.innerText = `${samples.length} / 3 Sample`;
            btnCount.innerText = `${samples.length}/3`;

            if (samples.length >= 3) {
                btnSnap.disabled = true;
                btnSave.disabled = false;
                promptText.innerText = "Sample lengkap! Klik 'Simpan Wajah'";
            } else if (samples.length === 1) {
                promptText.innerText = "Sample 1 tersimpan. Senyum sedikit lalu ambil lagi";
            } else if (samples.length === 2) {
                promptText.innerText = "Sample 2 tersimpan. Miringkan kepala sedikit lalu ambil";
            }
        }

        function resetSnapshots() {
            samples = [];
            countText.innerText = "0 / 3 Sample";
            btnCount.innerText = "0/3";
            btnSave.disabled = true;
            btnSnap.disabled = true;
            for (let i = 0; i < 3; i++) {
                const box = document.getElementById(`box-${i}`);
                box.innerHTML = `Sample ${i + 1}`;
                box.className = 'aspect-video bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-600 text-xs';
            }
            errorBox.classList.add('hidden');
        }

        async function saveFaceData() {
            if (samples.length < 3) return;

            btnSave.disabled = true;
            btnSave.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
            lucide.createIcons();

            // Calculate mean descriptor
            const dim = 128;
            const meanDesc = new Array(dim).fill(0);
            for (let i = 0; i < dim; i++) {
                let sum = 0;
                for (let j = 0; j < samples.length; j++) {
                    sum += samples[j][i];
                }
                meanDesc[i] = sum / samples.length;
            }

            try {
                const csrfToken = getCsrfToken();
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (csrfToken) {
                    headers['X-CSRF-Token'] = csrfToken;
                }

                const res = await fetch('/admin/face/save-descriptor', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        student_id: USER_ID,
                        descriptor: meanDesc
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    btnSave.className = 'flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2';
                    btnSave.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Sukses!';
                    lucide.createIcons();
                    setTimeout(() => {
                        window.location.href = `/admin/student/${USER_ID}`;
                    }, 1000);
                } else {
                    showErr(data.message || "Gagal menyimpan wajah");
                    btnSave.disabled = false;
                    btnSave.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Coba Simpan Lagi';
                    lucide.createIcons();
                }
            } catch (err) {
                console.error("Save error:", err);
                showErr("Gagal menghubungi server saat menyimpan wajah.");
                btnSave.disabled = false;
                btnSave.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Coba Simpan Lagi';
                lucide.createIcons();
            }
        }

        function showErr(msg) {
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
