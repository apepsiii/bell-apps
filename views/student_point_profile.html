<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Poin Siswa - SMK NIBA Super Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .slide-in { animation: slideIn 0.4s ease-out forwards; opacity: 0; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; opacity: 0; }
        
        .history-item { 
            animation: slideUp 0.4s ease-out forwards; 
            opacity: 0;
        }
        .history-item:nth-child(1) { animation-delay: 0.05s; }
        .history-item:nth-child(2) { animation-delay: 0.1s; }
        .history-item:nth-child(3) { animation-delay: 0.15s; }
        .history-item:nth-child(4) { animation-delay: 0.2s; }
        .history-item:nth-child(5) { animation-delay: 0.25s; }
        
        .stat-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 fade-in">
            <div class="flex items-center gap-4">
                <button onclick="window.close()" class="p-3 hover:bg-white/80 rounded-xl transition-all shadow-sm bg-white">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <div>
                    <h1 class="text-3xl font-black text-gray-800">Profil Poin Siswa</h1>
                    <p class="text-slate-500 text-sm mt-1 flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        History dan statistik lengkap
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-white rounded-xl shadow-md p-3 border border-gray-200">
                <i data-lucide="calendar" class="w-5 h-5 text-purple-500"></i>
                <span class="text-sm text-slate-600 font-semibold">Tahun Ajaran</span>
                <select id="year-filter" onchange="loadData()" class="border-2 border-gray-200 rounded-lg px-4 py-2 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all">
                    <option value="">Semua</option>
                </select>
            </div>
        </div>

        <!-- Student Info Card -->
        <div id="student-info" class="bg-white rounded-3xl shadow-xl border-2 border-gray-100 p-8 mb-8 hidden slide-in" style="animation-delay: 0.1s;">
            <div class="flex items-center gap-8">
                <div class="relative">
                    <div class="w-28 h-28 rounded-full bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center overflow-hidden shadow-2xl border-4 border-white">
                        <img id="student-photo" src="" class="w-full h-full object-cover hidden">
                        <i data-lucide="user" class="w-14 h-14 text-white" id="student-photo-placeholder"></i>
                    </div>
                    <div class="absolute -bottom-2 -right-2 bg-gradient-to-r from-emerald-400 to-teal-500 text-white rounded-full p-2 shadow-lg">
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </div>
                </div>
                <div class="flex-1">
                    <h2 id="student-name" class="text-3xl font-black text-slate-800 mb-1"></h2>
                    <p id="student-class" class="text-slate-600 font-semibold text-lg flex items-center gap-2 mb-1">
                        <i data-lucide="graduation-cap" class="w-5 h-5 text-blue-500"></i>
                        <span id="class-text"></span>
                    </p>
                    <p id="student-nis" class="text-sm text-slate-400 font-mono bg-slate-100 inline-block px-3 py-1 rounded-lg"></p>
                </div>
                <div class="text-center bg-gradient-to-br from-amber-50 to-yellow-50 p-6 rounded-2xl border-4 border-amber-200 shadow-lg">
                    <div id="total-points" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-yellow-600">0</div>
                    <p class="text-sm text-amber-700 uppercase tracking-wider font-bold mt-2">Total Poin</p>
                </div>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-4 gap-6 mb-8">
            <div class="stat-card bg-white rounded-2xl shadow-lg border-2 border-gray-100 p-6 text-center slide-in" style="animation-delay: 0.2s;">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="check-circle" class="w-8 h-8 text-white"></i>
                </div>
                <div id="stat-hadir" class="text-4xl font-black text-green-600 mb-2">0</div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-bold">Hadir</p>
            </div>
            <div class="stat-card bg-white rounded-2xl shadow-lg border-2 border-gray-100 p-6 text-center slide-in" style="animation-delay: 0.25s;">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="clock" class="w-8 h-8 text-white"></i>
                </div>
                <div id="stat-terlambat" class="text-4xl font-black text-orange-600 mb-2">0</div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-bold">Terlambat</p>
            </div>
            <div class="stat-card bg-white rounded-2xl shadow-lg border-2 border-gray-100 p-6 text-center slide-in" style="animation-delay: 0.3s;">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-red-400 to-rose-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="x-circle" class="w-8 h-8 text-white"></i>
                </div>
                <div id="stat-alpha" class="text-4xl font-black text-red-600 mb-2">0</div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-bold">Alpha</p>
            </div>
            <div class="stat-card bg-white rounded-2xl shadow-lg border-2 border-gray-100 p-6 text-center slide-in" style="animation-delay: 0.35s;">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="trophy" class="w-8 h-8 text-white"></i>
                </div>
                <div id="stat-ranking" class="text-4xl font-black text-blue-600 mb-2">#-</div>
                <p class="text-xs text-slate-500 uppercase tracking-wide font-bold">Ranking</p>
            </div>
        </div>

        <!-- History Section -->
        <div class="bg-white rounded-3xl shadow-xl border-2 border-gray-100 p-8 slide-in" style="animation-delay: 0.4s;">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-purple-500 to-indigo-600 text-white p-3 rounded-xl">
                        <i data-lucide="history" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-2xl font-black text-gray-800">Riwayat Poin</h3>
                </div>
                <span id="history-count" class="text-sm text-slate-500 bg-slate-100 px-4 py-2 rounded-full font-bold">0 aktivitas</span>
            </div>

            <div id="history-list" class="space-y-4 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                <div class="text-center py-12 text-slate-400">
                    <i data-lucide="loader-2" class="w-12 h-12 mx-auto animate-spin text-blue-500"></i>
                    <p class="mt-4 font-semibold text-lg">Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');

        async function loadData() {
            if (!studentId) {
                document.getElementById('history-list').innerHTML = '<div class="text-center py-8 text-red-400">ID siswa tidak valid</div>';
                return;
            }

            try {
                // Load student profile
                const profileRes = await fetch(`/admin/points/student/${studentId}`);
                const profile = await profileRes.json();

                if (profile.error || !profile.student) {
                    document.getElementById('history-list').innerHTML = '<div class="text-center py-8 text-red-400">Siswa tidak ditemukan</div>';
                    return;
                }

                // Update student info
                document.getElementById('student-info').classList.remove('hidden');
                document.getElementById('student-name').textContent = profile.student.name;
                document.getElementById('class-text').textContent = profile.student.class;
                document.getElementById('student-nis').textContent = 'NIS: ' + (profile.student.nis || '-');
                document.getElementById('total-points').textContent = profile.total_points;

                if (profile.student.photo) {
                    document.getElementById('student-photo').src = '/assets/photos/' + profile.student.photo;
                    document.getElementById('student-photo').classList.remove('hidden');
                    document.getElementById('student-photo-placeholder').classList.add('hidden');
                }

                // Calculate stats from history
                let hadir = 0, terlambat = 0, alpha = 0;
                profile.history.forEach(h => {
                    if (h.description.includes('Hadir Tepat Waktu')) hadir++;
                    else if (h.description.includes('Terlambat')) terlambat++;
                    else if (h.description.includes('Alpha')) alpha++;
                });

                document.getElementById('stat-hadir').textContent = hadir;
                document.getElementById('stat-terlambat').textContent = terlambat;
                document.getElementById('stat-alpha').textContent = alpha;

                // Render history
                const historyList = document.getElementById('history-list');
                document.getElementById('history-count').textContent = profile.history.length + ' aktivitas';

                if (profile.history.length === 0) {
                    historyList.innerHTML = `
                        <div class="text-center py-12 text-slate-400">
                            <i data-lucide="inbox" class="w-16 h-16 mx-auto text-gray-300 mb-4"></i>
                            <p class="font-semibold text-lg">Belum ada history</p>
                            <p class="text-sm mt-2">Riwayat poin akan muncul di sini</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                historyList.innerHTML = profile.history.map((h, idx) => {
                    const pointsColor = h.points_change >= 0 ? 'text-green-600' : 'text-red-600';
                    const bgGradient = h.points_change >= 0 ? 'from-green-50 to-emerald-50' : 'from-red-50 to-rose-50';
                    const borderColor = h.points_change >= 0 ? 'border-green-200' : 'border-red-200';
                    const iconBg = h.points_change >= 0 ? 'from-green-400 to-emerald-500' : 'from-red-400 to-rose-500';
                    const icon = h.points_change >= 0 ? 'trending-up' : 'trending-down';
                    const date = new Date(h.timestamp).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    return `
                        <div class="history-item group flex items-center gap-4 p-5 rounded-2xl bg-gradient-to-r ${bgGradient} border-2 ${borderColor} hover:shadow-lg transition-all">
                            <div class="w-14 h-14 rounded-full bg-gradient-to-br ${iconBg} flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
                                <i data-lucide="${icon}" class="w-7 h-7"></i>
                            </div>
                            <div class="flex-1">
                                <p class="font-bold text-slate-800 text-base mb-1">${h.description}</p>
                                <p class="text-xs text-slate-500 flex items-center gap-2">
                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                    ${date}
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-2xl ${pointsColor}">${h.points_change >= 0 ? '+' : ''}${h.points_change}</p>
                                <p class="text-xs text-slate-500 font-semibold uppercase">Poin</p>
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();

            } catch (err) {
                console.error(err);
                document.getElementById('history-list').innerHTML = '<div class="text-center py-8 text-red-400">Gagal memuat data</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
