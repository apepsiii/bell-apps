<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Sumber Dana - Sarpras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            padding: 32px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
            font-weight: 400;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #404040;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: #1a1a1a;
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 24px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            padding: 14px 20px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: #d1fae5;
            color: #065f46;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #9ca3af;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .alert {
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            border: 1px solid;
        }

        .alert-success {
            background: #f0fdf4;
            color: #065f46;
            border-color: #86efac;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }

        .close {
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
            line-height: 1;
            padding: 4px;
            transition: color 0.2s;
        }

        .close:hover {
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: white;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1>💰 Sumber Dana</h1>
                    <p>Manajemen Sumber Pembiayaan Aset</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <a href="/admin/sarpras" class="btn btn-secondary">← Kembali</a>
                    <button class="btn btn-primary" onclick="openAddModal()">+ Tambah Sumber Dana</button>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Nama Sumber Dana</th>
                            <th>Deskripsi</th>
                            <th>Tanggal Dibuat</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="sourcesBody">
                        <tr>
                            <td colspan="5" class="loading">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit -->
    <div id="sourceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Sumber Dana</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="sourceForm" onsubmit="saveSource(event)">
                <input type="hidden" id="sourceId">
                
                <div class="form-group">
                    <label>Kode Sumber Dana *</label>
                    <input type="text" id="code" required placeholder="Contoh: BOS, KOMITE, HIBAH">
                </div>

                <div class="form-group">
                    <label>Nama Sumber Dana *</label>
                    <input type="text" id="name" required placeholder="Contoh: Dana BOS">
                </div>

                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="description" placeholder="Deskripsi sumber dana..."></textarea>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-success">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let sources = [];

        async function loadSources() {
            try {
                const response = await fetch('/admin/sarpras/api/funding-sources');
                sources = await response.json();
                renderSources();
            } catch (error) {
                console.error('Failed to load sources:', error);
                showAlert('Gagal memuat data sumber dana', 'error');
            }
        }

        function renderSources() {
            const tbody = document.getElementById('sourcesBody');
            
            if (sources.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="icon">💰</div>
                            <p>Belum ada sumber dana</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = sources.map(src => `
                <tr>
                    <td><span class="badge">${src.code}</span></td>
                    <td><strong style="font-weight: 600;">${src.name}</strong></td>
                    <td style="color: #6b7280;">${src.description || '-'}</td>
                    <td>${new Date(src.created_at).toLocaleDateString('id-ID')}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary" style="padding: 8px 16px; font-size: 13px;" onclick="editSource(${src.id})">Edit</button>
                            <button class="btn btn-danger" style="padding: 8px 16px; font-size: 13px;" onclick="deleteSource(${src.id}, '${src.name}')">Hapus</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Tambah Sumber Dana';
            document.getElementById('sourceForm').reset();
            document.getElementById('sourceId').value = '';
            document.getElementById('sourceModal').classList.add('active');
        }

        function editSource(id) {
            const source = sources.find(s => s.id === id);
            if (!source) return;

            document.getElementById('modalTitle').textContent = 'Edit Sumber Dana';
            document.getElementById('sourceId').value = id;
            document.getElementById('code').value = source.code;
            document.getElementById('name').value = source.name;
            document.getElementById('description').value = source.description || '';
            document.getElementById('sourceModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('sourceModal').classList.remove('active');
            document.getElementById('sourceForm').reset();
        }

        async function saveSource(event) {
            event.preventDefault();

            const id = document.getElementById('sourceId').value;
            const formData = new FormData();
            formData.append('code', document.getElementById('code').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);

            try {
                const url = id ? `/admin/sarpras/api/funding-source/update/${id}` : '/admin/sarpras/api/funding-source/add';
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(id ? 'Sumber dana berhasil diupdate' : 'Sumber dana berhasil ditambahkan', 'success');
                    closeModal();
                    loadSources();
                } else {
                    showAlert(result.error || 'Gagal menyimpan sumber dana', 'error');
                }
            } catch (error) {
                console.error('Failed to save source:', error);
                showAlert('Gagal menyimpan sumber dana', 'error');
            }
        }

        async function deleteSource(id, name) {
            if (!confirm(`Hapus sumber dana "${name}"?\n\nPeringatan: Sumber dana yang memiliki aset tidak bisa dihapus.`)) {
                return;
            }

            try {
                const response = await fetch(`/admin/sarpras/api/funding-source/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Sumber dana berhasil dihapus', 'success');
                    loadSources();
                } else {
                    showAlert(result.error || 'Gagal menghapus sumber dana', 'error');
                }
            } catch (error) {
                console.error('Failed to delete source:', error);
                showAlert('Gagal menghapus sumber dana', 'error');
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">${message}</div>
            `;

            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        loadSources();
    </script>
</body>
</html>
