<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Profile - SMK NIBA Super Apps Operator</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

            body {
                font-family: 'Inter', sans-serif;
                padding-bottom: 80px;
                background: linear-gradient(to bottom, #f9fafb 0%, #ffffff 100%);
            }

            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
                z-index: 50;
                border-top: 1px solid #f3f4f6;
            }

            .nav-item.active {
                color: #059669;
            }

            .profile-gradient {
                background: linear-gradient(135deg, #059669 0%, #047857 100%);
            }

            .card-hover {
                transition: all 0.2s ease;
            }

            .card-hover:active {
                transform: scale(0.98);
            }
        </style>
    </head>

    <body>

        <!-- Header -->
        <div class="profile-gradient text-white p-6 pb-24">
            <h1 class="text-2xl font-bold tracking-tight">Profile Operator</h1>
            <p class="text-sm opacity-90 mt-1">Kelola informasi akun Anda</p>
        </div>

        <!-- Profile Card -->
        <div class="px-4 -mt-16">
            <div class="bg-white rounded-3xl shadow-xl p-6 border border-gray-100">
                <!-- Avatar -->
                <div class="flex flex-col items-center mb-6">
                    <div class="relative mb-4">
                        <div class="w-28 h-28 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-full flex items-center justify-center shadow-lg ring-4 ring-emerald-100">
                            <i data-lucide="user" class="w-14 h-14 text-white"></i>
                        </div>
                        <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg">
                            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 text-center" id="operatorName">Loading...</h2>
                    <p class="text-sm text-emerald-600 font-semibold mt-1" id="operatorUsername">@username</p>
                </div>

                <!-- Info -->
                <div class="space-y-3">
                    <div class="flex items-center gap-4 p-4 bg-gradient-to-r from-gray-50 to-gray-100 rounded-2xl">
                        <div class="w-11 h-11 bg-white rounded-xl flex items-center justify-center shadow-sm">
                            <i data-lucide="phone" class="w-5 h-5 text-emerald-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-semibold mb-0.5">Nomor Telepon</p>
                            <span class="text-gray-900 font-bold" id="operatorPhone">-</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 p-4 bg-gradient-to-r from-gray-50 to-gray-100 rounded-2xl">
                        <div class="w-11 h-11 bg-white rounded-xl flex items-center justify-center shadow-sm">
                            <i data-lucide="calendar" class="w-5 h-5 text-emerald-600"></i>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-semibold mb-0.5">Bergabung Sejak</p>
                            <span class="text-gray-900 font-bold text-sm" id="joinDate">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="mt-6 space-y-3">
                <button onclick="changePassword()"
                    class="card-hover w-full bg-white text-gray-900 py-4 px-5 rounded-2xl font-bold shadow-sm border border-gray-200 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-sm">
                            <i data-lucide="key" class="w-5 h-5 text-white"></i>
                        </div>
                        <span>Ubah Password</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 group-hover:translate-x-1 transition-transform"></i>
                </button>
                <button onclick="logout()"
                    class="card-hover w-full bg-gradient-to-r from-red-500 to-red-600 text-white py-4 px-5 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-3 hover:shadow-xl">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>Keluar dari Akun</span>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="grid grid-cols-4 h-16">
                <a href="/operator/dashboard" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-700 transition-colors">
                    <i data-lucide="home" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Home</span>
                </a>
                <a href="/operator/scan" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-700 transition-colors">
                    <i data-lucide="scan" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Scan</span>
                </a>
                <a href="/operator/manual" class="nav-item flex flex-col items-center justify-center text-gray-500 hover:text-gray-700 transition-colors">
                    <i data-lucide="clipboard-check" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Manual</span>
                </a>
                <a href="/operator/profile" class="nav-item active flex flex-col items-center justify-center">
                    <i data-lucide="user" class="w-6 h-6 mb-1"></i>
                    <span class="text-xs font-semibold">Profile</span>
                </a>
            </div>
        </div>

        <script>
            lucide.createIcons();

            // Load profile
            async function loadProfile() {
                try {
                    const res = await fetch('/api/operator/profile');
                    const data = await res.json();

                    document.getElementById('operatorName').textContent = data.name;
                    document.getElementById('operatorUsername').textContent = '@' + data.username;
                    document.getElementById('operatorPhone').textContent = data.phone || '-';

                    if (data.created_at) {
                        const date = new Date(data.created_at);
                        document.getElementById('joinDate').textContent = date.toLocaleDateString('id-ID', {
                            day: 'numeric',
                            month: 'long',
                            year: 'numeric'
                        });
                    }
                } catch (err) {
                    console.error('Failed to load profile:', err);
                }
            }

            function changePassword() {
                const oldPass = prompt('Masukkan password lama:');
                if (!oldPass) return;

                const newPass = prompt('Masukkan password baru:');
                if (!newPass) return;

                const confirmPass = prompt('Konfirmasi password baru:');
                if (newPass !== confirmPass) {
                    alert('Password tidak cocok!');
                    return;
                }

                fetch('/api/operator/password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        old_password: oldPass,
                        new_password: newPass
                    })
                })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                    })
                    .catch(err => {
                        alert('Terjadi kesalahan');
                    });
            }

            async function logout() {
                if (!confirm('Yakin ingin logout?')) return;

                try {
                    await fetch('/api/operator/logout', { method: 'POST' });
                    window.location.href = '/operator/login';
                } catch (err) {
                    console.error('Logout failed:', err);
                }
            }

            loadProfile();
        </script>
    </body>

</html>
