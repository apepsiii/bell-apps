<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Audit Point System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">🧪 Test Audit & Validation System</h1>

        <!-- Test Results Container -->
        <div id="results" class="space-y-4 mb-8"></div>

        <!-- Test Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Test 1: Add Point -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">✅ Test 1: Add Point (Valid)</h3>
                <button onclick="testAddPointValid()" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700">
                    Run Test
                </button>
            </div>

            <!-- Test 2: Max Validation -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">❌ Test 2: Max Validation (>100)</h3>
                <button onclick="testMaxValidation()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                    Run Test
                </button>
            </div>

            <!-- Test 3: Rate Limit -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">⏱️ Test 3: Rate Limit (50x)</h3>
                <button onclick="testRateLimit()" class="bg-amber-600 text-white px-4 py-2 rounded hover:bg-amber-700">
                    Run Test (Takes ~10s)
                </button>
            </div>

            <!-- Test 4: Soft Delete -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">🗑️ Test 4: Soft Delete</h3>
                <button onclick="testSoftDelete()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Run Test
                </button>
            </div>

            <!-- Test 5: Delete Without Reason -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">❌ Test 5: Delete No Reason</h3>
                <button onclick="testDeleteNoReason()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                    Run Test
                </button>
            </div>

            <!-- Test 6: Authorization -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-bold mb-4">🔒 Test 6: Authorization</h3>
                <button onclick="testAuthorization()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                    Run Test
                </button>
            </div>
        </div>
    </div>

    <script>
        const resultsContainer = document.getElementById('results');

        function addResult(title, status, message, details = '') {
            const statusIcon = status === 'success' ? '✅' : status === 'error' ? '❌' : '⚠️';
            const statusColor = status === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 
                               status === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 
                               'bg-amber-50 border-amber-200 text-amber-800';
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `${statusColor} border-2 rounded-lg p-4`;
            resultDiv.innerHTML = `
                <div class="flex items-start gap-3">
                    <span class="text-2xl">${statusIcon}</span>
                    <div class="flex-1">
                        <h4 class="font-bold">${title}</h4>
                        <p class="text-sm mt-1">${message}</p>
                        ${details ? `<pre class="text-xs mt-2 bg-white/50 p-2 rounded overflow-x-auto">${details}</pre>` : ''}
                    </div>
                </div>
            `;
            resultsContainer.insertBefore(resultDiv, resultsContainer.firstChild);
        }

        async function testAddPointValid() {
            try {
                const formData = new FormData();
                formData.append('student_id', '1');
                formData.append('rule_id', '1');
                formData.append('points', '50');
                formData.append('description', 'Test add point valid');
                formData.append('recorded_by', 'test_admin');

                const res = await fetch('/admin/v2/student/achievement', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    addResult('Test 1: Add Point Valid', 'success', 
                        `✅ PASS - Point berhasil ditambahkan`, 
                        JSON.stringify(data, null, 2));
                } else {
                    addResult('Test 1: Add Point Valid', 'error', 
                        `❌ FAIL - ${data.error}`, 
                        JSON.stringify(data, null, 2));
                }
            } catch (err) {
                addResult('Test 1: Add Point Valid', 'error', 
                    `❌ ERROR - ${err.message}`);
            }
        }

        async function testMaxValidation() {
            try {
                const formData = new FormData();
                formData.append('student_id', '1');
                formData.append('points', '150'); // Over limit!
                formData.append('description', 'Test max validation');
                formData.append('recorded_by', 'test_admin');

                const res = await fetch('/admin/v2/student/achievement', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (!res.ok && data.error && data.error.includes('Maksimal')) {
                    addResult('Test 2: Max Validation', 'success', 
                        `✅ PASS - Validasi bekerja dengan baik`, 
                        `Expected error: ${data.error}`);
                } else {
                    addResult('Test 2: Max Validation', 'error', 
                        `❌ FAIL - Validasi tidak bekerja!`, 
                        JSON.stringify(data, null, 2));
                }
            } catch (err) {
                addResult('Test 2: Max Validation', 'error', 
                    `❌ ERROR - ${err.message}`);
            }
        }

        async function testRateLimit() {
            addResult('Test 3: Rate Limit', 'warning', 'Testing... Please wait ~10 seconds');
            
            let successCount = 0;
            let limitReached = false;

            for (let i = 1; i <= 52; i++) {
                try {
                    const formData = new FormData();
                    formData.append('student_id', '1');
                    formData.append('rule_id', '1');
                    formData.append('points', '5');
                    formData.append('recorded_by', 'rate_limit_tester');

                    const res = await fetch('/admin/v2/student/achievement', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (res.status === 429) {
                        limitReached = true;
                        addResult('Test 3: Rate Limit', 'success', 
                            `✅ PASS - Rate limit bekerja setelah ${successCount} requests`, 
                            `Message: ${data.error || data.message}`);
                        break;
                    } else if (res.ok) {
                        successCount++;
                    }
                } catch (err) {
                    addResult('Test 3: Rate Limit', 'error', `❌ ERROR - ${err.message}`);
                    break;
                }
            }

            if (!limitReached) {
                addResult('Test 3: Rate Limit', 'error', 
                    `❌ FAIL - Rate limit tidak bekerja! Berhasil ${successCount} requests`);
            }
        }

        async function testSoftDelete() {
            // First, create a point
            try {
                const formData = new FormData();
                formData.append('student_id', '1');
                formData.append('points', '10');
                formData.append('description', 'Test soft delete');
                formData.append('recorded_by', 'test_admin');

                const addRes = await fetch('/admin/v2/student/achievement', {
                    method: 'POST',
                    body: formData
                });
                const addData = await addRes.json();

                if (!addRes.ok) {
                    addResult('Test 4: Soft Delete', 'error', 
                        `❌ FAIL - Gagal create point: ${addData.error}`);
                    return;
                }

                // Get the last inserted ID (you need to implement this in your API)
                // For now, assume ID 1
                const deleteFormData = new FormData();
                deleteFormData.append('reason', 'Test soft delete with reason');

                const deleteRes = await fetch('/admin/v2/achievement/1', {
                    method: 'DELETE',
                    body: deleteFormData
                });
                const deleteData = await deleteRes.json();

                if (deleteRes.ok) {
                    addResult('Test 4: Soft Delete', 'success', 
                        `✅ PASS - Soft delete berhasil`, 
                        JSON.stringify(deleteData, null, 2));
                } else {
                    addResult('Test 4: Soft Delete', 'warning', 
                        `⚠️ ${deleteData.error}`, 
                        'Note: Might fail due to authorization or record not found');
                }
            } catch (err) {
                addResult('Test 4: Soft Delete', 'error', 
                    `❌ ERROR - ${err.message}`);
            }
        }

        async function testDeleteNoReason() {
            try {
                const deleteRes = await fetch('/admin/v2/achievement/1', {
                    method: 'DELETE'
                });
                const deleteData = await deleteRes.json();

                if (!deleteRes.ok && deleteData.error && deleteData.error.includes('Alasan')) {
                    addResult('Test 5: Delete No Reason', 'success', 
                        `✅ PASS - Validasi reason bekerja`, 
                        `Expected error: ${deleteData.error}`);
                } else {
                    addResult('Test 5: Delete No Reason', 'error', 
                        `❌ FAIL - Delete tanpa reason berhasil!`, 
                        JSON.stringify(deleteData, null, 2));
                }
            } catch (err) {
                addResult('Test 5: Delete No Reason', 'error', 
                    `❌ ERROR - ${err.message}`);
            }
        }

        async function testAuthorization() {
            try {
                const deleteFormData = new FormData();
                deleteFormData.append('reason', 'Test authorization');

                const deleteRes = await fetch('/admin/v2/achievement/1', {
                    method: 'DELETE',
                    body: deleteFormData,
                    headers: {
                        'X-User-Role': 'admin' // Regular admin, not kepala_sekolah
                    }
                });
                const deleteData = await deleteRes.json();

                if (!deleteRes.ok && deleteRes.status === 403) {
                    addResult('Test 6: Authorization', 'success', 
                        `✅ PASS - Authorization check bekerja`, 
                        `Expected error: ${deleteData.error}`);
                } else {
                    addResult('Test 6: Authorization', 'warning', 
                        `⚠️ Authorization check might not be fully implemented yet`, 
                        JSON.stringify(deleteData, null, 2));
                }
            } catch (err) {
                addResult('Test 6: Authorization', 'error', 
                    `❌ ERROR - ${err.message}`);
            }
        }

        // Auto-run basic health check on load
        window.onload = () => {
            addResult('System Ready', 'success', 
                'Test page loaded. Click buttons above to run tests.', 
                'Base URL: ' + window.location.origin);
        };
    </script>
</body>
</html>
